<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Entrega de Equipo - Freund</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    
    <style>
        /* --- ESTILOS BASE --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 10px; 
        }
        .container {
            width: 100%; 
            max-width: 850px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        /* Estilo para centrar el logo */
        .header-logo-container {
            text-align: center;
            margin-bottom: 10px;
        }
        .header-logo {
            width: 120px; 
            height: auto;
        }
        h1 {
            text-align: center;
            color: #1a4d8c; /* Azul corporativo */
            border-bottom: 3px solid #f29c1f; 
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.5em; 
        }
        h2 {
            color: #333;
            margin-top: 20px;
            border-left: 5px solid #1a4d8c;
            padding-left: 10px;
            font-size: 1.2em; 
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .form-field {
            flex: 1 1 100%; 
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 0.9em;
        }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; 
        }
        .full-width {
            flex: 1 1 100%; 
        }
        .radio-group label {
            font-weight: normal;
            display: block; 
            margin-right: 0;
            margin-bottom: 5px;
        }
        .software-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
        }
        .software-list div {
            flex: 1 1 calc(50% - 10px); 
            font-size: 0.9em;
        }
        
        /* --- ESTILOS DE BOTONES --- */
        .btn-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-base {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%;
            color: white;
        }

        /* Botón 1: Firmar (Azul corporativo) */
        #startSignatureBtn {
            background-color: #1a4d8c; 
        }
        #startSignatureBtn:hover {
            background-color: #153c6e;
        }

        /* Botón 2: Generar PDF con firma (Naranja corporativo) */
        #generatePdfBtn {
            background-color: #f29c1f; 
            display: none; 
        }
        #generatePdfBtn:hover {
            background-color: #d1871a;
        }

        /* Botón 3: Generar PDF sin firma (Verde Claro) */
        #generatePdfNoSigBtn {
            background-color: #4CAF50; 
        }
        #generatePdfNoSigBtn:hover {
            background-color: #45a049;
        }

        /* Botón 4: Inicio (Celeste Claro del logo) */
        #homeBtn {
            background-color: #00bcd4; /* Celeste Claro */
        }
        #homeBtn:hover {
            background-color: #0097a7;
        }

        /* MEDIA QUERY PARA ESCRITORIO */
        @media (min-width: 600px) {
            .container {
                padding: 30px;
            }
            .form-field {
                flex: 1 1 45%; 
            }
            .radio-group label {
                display: inline-block; 
                margin-right: 15px;
            }
            .software-list div {
                flex: 1 1 calc(33.333% - 10px); 
                font-size: 1em;
            }
            .btn-group {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 15px;
            }
            .btn-group button {
                flex: 1 1 calc(50% - 10px); 
            }
            #generatePdfBtn, #generatePdfNoSigBtn, #homeBtn, #startSignatureBtn {
                 flex: 1 1 calc(50% - 10px);
                 max-width: 49%;
            }
        }
        /* --- ESTILOS DE MODAL DE FIRMA --- */
        .signature-modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
            padding-top: 50px;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #signature-canvas {
            border: 1px solid #000;
            width: 100%;
            height: 200px;
            cursor: crosshair;
            background-color: #fff;
            touch-action: none; 
        }
        .modal-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap; /* Permite que los botones se envuelvan si es necesario */
            gap: 10px;
        }
        .modal-buttons button {
            width: 48%; /* Ajuste para tres botones en móvil */
            padding: 10px;
            font-size: 14px;
        }
        .clear-button {
            background-color: #ccc !important;
            color: #333 !important;
        }
        /* Estilos para el nuevo botón Cancelar */
        #cancelSignatureBtn {
            background-color: #f44336; /* Rojo */
        }
        #cancelSignatureBtn:hover {
            background-color: #d32f2f;
        }

        /* Ajuste de ancho de botones en escritorio (3 botones) */
        @media (min-width: 600px) {
            .modal-buttons {
                justify-content: flex-start;
                gap: 10px;
            }
            .modal-buttons button {
                width: calc(33.333% - 10px); /* Ajuste para tres botones */
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-logo-container">
        <img src="https://raw.githubusercontent.com/invs99/FF/SEGUNDA/freund1.png" alt="Logo Freund" class="header-logo">
    </div>
    
    <h1>REGISTRO DE ENTREGA DE EQUIPO</h1>
    
    <form id="deliveryForm">
        
        <h2>Nombre de Receptor</h2>
        <div class="form-group">
            <div class="form-field">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required value="JOSE MAURICIO SHUPAN GUTIERREZ">
            </div>
            <div class="form-field">
                <label for="usuario">Nombre de Usuario:</label>
                <input type="text" id="usuario" name="usuario" required value="JSHUPAN">
            </div>
        </div>

        <div class="form-group">
            <div class="form-field full-width">
                <label for="depto">Departamento/Sucursal:</label>
                <input type="text" id="depto" name="depto" required value="SUPERVISOR INDUSTRIA">
            </div>
        </div>

        <div class="form-group full-width">
            <label>Estado del Equipo:</label>
            <div class="radio-group">
                <label><input type="radio" name="estado" value="Equipo Nuevo" checked> Equipo Nuevo</label>
                <label><input type="radio" name="estado" value="Renovación"> Renovación</label>
                <label><input type="radio" name="estado" value="Cambio"> Cambio</label>
            </div>
        </div>

        <h2>Entrega:</h2> 
        <div class="form-group">
            <div class="form-field">
                <label for="nombreEntregador">Nombre del personal de Entrega:</label>
                <input type="text" id="nombreEntregador" name="nombreEntregador" required value="Jonathan Alexander Navas">
            </div>
            <div class="form-field">
                <label for="cargoEntregador">Cargo del personal de Entrega:</label>
                <input type="text" id="cargoEntregador" name="cargoEntregador" required value="Soporte Técnico">
            </div>
        </div>

        <h2>Registro de Hardware Entregado</h2>
        <div class="form-group">
            <div class="form-field full-width">
                <label for="marcaModeloHW">Marca y Modelo de la Laptop:</label>
                <input type="text" id="marcaModeloHW" name="marcaModeloHW" value="Lenovo T14 Gen 4">
            </div>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="caracteristicas">Características (Ej: Procesador, RAM, Disco):</label>
                <textarea id="caracteristicas" name="caracteristicas" rows="3">Intel Core ultra 5, 1.3 GHz, 32GB RAM, 500 GB SSD</textarea>
            </div>
            <div class="form-field">
                <label for="serie">No. de Serie / IMEI:</label>
                <input type="text" id="serie" name="serie" value="PF-5M9BWP">
            </div>
        </div>

        <h2>Accesorios Entregados</h2>
        <div class="form-group">
            <div class="form-field">
                <label for="cargador">Cargador (Marca/Especificación):</label>
                <input type="text" id="cargador" name="cargador" value="Lenovo ADLX65YSDC2A (20v-3.25a, 65w)">
            </div>
            <div class="form-field">
                <label for="cableSeguridad">Cable de Seguridad:</label>
                <input type="text" id="cableSeguridad" name="cableSeguridad" value="Lenovo nano">
            </div>
        </div>

        <h2>Registro de Software Instalado</h2>
        <div class="form-group full-width">
            <label>Programas Autorizados (Seleccionar los instalados):</label>
            <div class="software-list">
                <div><label><input type="checkbox" name="software" value="Windows 11" checked> Windows 11</label></div>
                <div><label><input type="checkbox" name="software" value="Office 365" checked> Office 365</label></div>
                <div><label><input type="checkbox" name="software" value="Google Chrome" checked> Google Chrome</label></div>
                <div><label><input type="checkbox" name="software" value="BitLocker" checked> BitLocker</label></div>
                <div><label><input type="checkbox" name="software" value="Trend Micro" checked> Trend Micro</label></div>
                <div><label><input type="checkbox" name="software" value="Acrobat Reader" checked> Acrobat Reader</label></div>
                <div><label><input type="checkbox" name="software" value="Citrix" checked> Citrix</label></div>
                <div><label><input type="checkbox" name="software" value="Libre office" checked> Libre office</label></div>
                <div><label><input type="checkbox" name="software" value="Neskope" checked> Neskope</label></div>
                <div><label><input type="checkbox" name="software" value="VLC media player" checked> VLC media player</label></div>
                <div><label><input type="checkbox" name="software" value="Zoom Workplace" checked> Zoom Workplace</label></div>
                <div><label><input type="checkbox" name="software" value="Microsoft Edge" checked> Microsoft Edge</label></div>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" id="startSignatureBtn" class="btn-base">Realizar firmas</button>
            
            <button type="button" id="generatePdfBtn" class="btn-base">Generar Documento de Entrega (PDF)</button>

            <button type="button" id="generatePdfNoSigBtn" class="btn-base">Generar Documento sin firma</button>
            
            <button type="button" id="homeBtn" class="btn-base">Inicio</button>
        </div>
    </form>
</div>

<div id="signatureModal" class="signature-modal">
    <div class="modal-content">
        <h3 id="signerName">Firma del personal de Entrega</h3>
        <canvas id="signature-canvas"></canvas>
        <div class="modal-buttons">
            <button type="button" class="clear-button" id="clearSignatureBtn">Limpiar</button>
            <button type="button" id="confirmSignatureBtn">Confirmar y Continuar</button>
             <button type="button" class="btn-base" id="cancelSignatureBtn">Cancelar</button>
        </div>
        <p style="font-size: 0.8em; color: #555; margin-top: 10px;">* Utilice el mouse o la pantalla táctil para firmar.</p>
    </div>
</div>

<script>
    window.jsPDF = window.jspdf.jsPDF;
    
    // URL del logo (Se mantiene la constante)
    const LOGO_URL = 'https://raw.githubusercontent.com/invs99/FF/SEGUNDA/freund1.png';
    const LOGO_WIDTH = 35; 
    const LOGO_HEIGHT = 15; 

    // --- VARIABLES DE FIRMA DIGITAL ---
    let delivererSignatureData = null;
    let receiverSignatureData = null;
    let signaturePad = null;
    let currentSigner = 'deliverer'; 

    // Elementos del DOM
    const signatureModal = document.getElementById('signatureModal');
    const signatureCanvas = document.getElementById('signature-canvas');
    const signerNameElement = document.getElementById('signerName');
    const confirmSignatureBtn = document.getElementById('confirmSignatureBtn');
    const clearSignatureBtn = document.getElementById('clearSignatureBtn');
    const cancelSignatureBtn = document.getElementById('cancelSignatureBtn'); // Nuevo botón
    const startSignatureBtn = document.getElementById('startSignatureBtn');
    const generatePdfBtn = document.getElementById('generatePdfBtn');
    const generatePdfNoSigBtn = document.getElementById('generatePdfNoSigBtn');
    const homeBtn = document.getElementById('homeBtn');
    
    // Función para convertir la URL de la imagen a Base64
    function urlToBase64(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.onload = function() {
            var reader = new FileReader();
            reader.onloadend = function() {
                callback(reader.result);
            }
            xhr.response.type = 'image/png';
            reader.readAsDataURL(xhr.response);
        };
        xhr.onerror = function() {
            console.error("Error al cargar la imagen del logo.");
            callback(null); 
        };
        xhr.open('GET', url);
        xhr.responseType = 'blob';
        xhr.send();
    }
    
    // --- LÓGICA DE FIRMA DIGITAL ---

    function resizeAndCalibrateCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        
        signatureCanvas.width = signatureCanvas.offsetWidth * ratio;
        signatureCanvas.height = signatureCanvas.offsetHeight * ratio;
        
        signatureCanvas.getContext("2d").scale(ratio, ratio);

        if (!signaturePad) {
            signaturePad = new SignaturePad(signatureCanvas, {
                backgroundColor: 'rgb(255, 255, 255)',
                penColor: 'rgb(0, 0, 0)'
            });
        }

        signaturePad.clear();
    }

    function showSignatureModal() {
        const nombreEmpleado = document.getElementById('nombre').value;
        const nombreEntregador = document.getElementById('nombreEntregador').value;
        const cargoEntregador = document.getElementById('cargoEntregador').value;

        if (currentSigner === 'deliverer') {
            signerNameElement.textContent = `Firma del personal de Entrega (${nombreEntregador} - ${cargoEntregador})`;
            confirmSignatureBtn.textContent = 'Confirmar y Continuar';
        } else if (currentSigner === 'receiver') {
            signerNameElement.textContent = `Firma del Receptor (${nombreEmpleado})`;
            confirmSignatureBtn.textContent = 'Confirmar y Terminar';
        }

        signatureModal.style.display = 'block';
        
        setTimeout(resizeAndCalibrateCanvas, 100); 
    }

    function cancelSignatureProcess() {
        // Restablece las variables de firma
        delivererSignatureData = null;
        receiverSignatureData = null;
        currentSigner = 'deliverer';
        
        // Oculta el modal
        signatureModal.style.display = 'none';
        
        // Asegura que solo se muestren los botones de inicio de firma
        startSignatureBtn.style.display = 'block'; 
        generatePdfBtn.style.display = 'none'; 
    }

    function confirmSignature() {
        if (!signaturePad || signaturePad.isEmpty()) {
            alert("Por favor, escriba su firma antes de confirmar.");
            return;
        }
        
        const signatureData = signaturePad.toDataURL('image/jpeg', 0.8); 
        signatureModal.style.display = 'none'; 

        if (currentSigner === 'deliverer') {
            delivererSignatureData = signatureData;
            currentSigner = 'receiver';
            showSignatureModal(); 
        } else if (currentSigner === 'receiver') {
            receiverSignatureData = signatureData;
            
            startSignatureBtn.style.display = 'none'; 
            generatePdfBtn.style.display = 'block'; 
            alert("¡Firmas capturadas con éxito! Ahora puede generar el PDF.");
        }
    }

    // --- EVENT LISTENERS ---
    
    startSignatureBtn.addEventListener('click', function() {
        currentSigner = 'deliverer';
        delivererSignatureData = null; // Limpiar datos de intentos anteriores
        receiverSignatureData = null;
        showSignatureModal();
    });

    generatePdfBtn.addEventListener('click', function() {
        if (delivererSignatureData && receiverSignatureData) {
            urlToBase64(LOGO_URL, function(logoData) {
                generatePDF(logoData, true); // Incluye firmas
            });
        } else {
            alert("Debe capturar ambas firmas digitales antes de usar este botón.");
        }
    });

    generatePdfNoSigBtn.addEventListener('click', function() {
        urlToBase64(LOGO_URL, function(logoData) {
            generatePDF(logoData, false); // NO incluye firmas
        });
    });

    homeBtn.addEventListener('click', function() {
        window.location.href = 'https://invs99.github.io/FF/index.html';
    });


    clearSignatureBtn.addEventListener('click', () => {
        if (signaturePad) {
            signaturePad.clear();
        }
    });

    confirmSignatureBtn.addEventListener('click', confirmSignature);
    
    // NUEVO EVENTO PARA CANCELAR
    cancelSignatureBtn.addEventListener('click', cancelSignatureProcess);


    // --- FUNCIÓN PRINCIPAL DE GENERACIÓN DE PDF (Acepta 'includeSignatures') ---
    function generatePDF(logoData, includeSignatures = true) {
        const doc = new jsPDF('p', 'mm', 'letter'); 
        const form = document.getElementById('deliveryForm');

        // --- 1. CAPTURA DE DATOS DEL FORMULARIO ---
        const nombre = form.elements['nombre'].value;
        const usuario = form.elements['usuario'].value;
        const depto = form.elements['depto'].value;
        const estado = form.elements['estado'].value;
        const marcaModeloHW = form.elements['marcaModeloHW'].value; 
        const caracteristicas = form.elements['caracteristicas'].value.replace(/\n/g, ', ');
        const serie = form.elements['serie'].value;
        const cargador = form.elements['cargador'].value;
        const cableSeguridad = form.elements['cableSeguridad'].value;
        
        const nombreEntregador = form.elements['nombreEntregador'].value;
        const cargoEntregador = form.elements['cargoEntregador'].value;

        const today = new Date();
        const fechaEntrega = today.toLocaleDateString('es-SV', { day: 'numeric', month: 'long', year: 'numeric' });
        const todayShort = today.toLocaleDateString('es-SV', { year: 'numeric', month: '2-digit', day: '2-digit' });

        const softwareList = Array.from(form.querySelectorAll('input[name="software"]:checked'))
                                       .map(cb => cb.value);
        
        const half = Math.ceil(softwareList.length / 2);
        const softwareCol1 = softwareList.slice(0, half);
        const softwareCol2 = softwareList.slice(half);

        const softwareTableData = [];
        for (let i = 0; i < half; i++) {
            softwareTableData.push([
                softwareCol1[i] || '',
                softwareCol2[i] || ''
            ]);
        }
        
        // --- 2. ENCABEZADO, LOGO Y TÍTULOS ---
        
        if (logoData) {
            doc.addImage(logoData, 'PNG', 14, 10, LOGO_WIDTH, LOGO_HEIGHT); 
        }
        
        // Nuevo Encabezado Superior Derecho (Ajustado)
        const newFontSize = 8 * 0.85; // Reducido 15% (aprox 6.8 pt)
        const startYOffset = 3.5; // Baja 1 renglón (3.5 mm)
        const rightMargin = 205; 
        let headerY = 10 + startYOffset;
        
        doc.setFontSize(newFontSize); 
        doc.setFont(undefined, 'normal');
        doc.setTextColor(0, 0, 0); 
        
        doc.text('Tiendas 01.001.0001.0001', rightMargin, headerY, { align: 'right' });
        headerY += 3;
        doc.text('Redes Soporte y', rightMargin, headerY, { align: 'right' });
        headerY += 3;
        doc.text('Telecomunicaciones', rightMargin, headerY, { align: 'right' });
        headerY += 4; // Espacio antes de la fecha
        doc.text(`Fecha de Reporte: ${todayShort}`, rightMargin, headerY, { align: 'right' }); 

        // Título Central
        const titleX = 107.95; 
        const titleY = 20; 
        
        doc.setFontSize(12); 
        doc.setFont(undefined, 'bold');
        doc.setTextColor(26, 77, 140); 
        doc.text('REGISTRO DE ENTREGA DE EQUIPO DE OFICINA', titleX, titleY, { align: 'center' }); 
        
        doc.text('HARDWARE Y SOFTWARE', titleX, titleY + 4, { align: 'center' }); 
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        
        let currentY = titleY + 8; // Posición de la tabla después del espacio en blanco

        // --- 3. TABLA DE INFORMACIÓN DEL USUARIO ---
        doc.autoTable({
            startY: currentY + 3, 
            head: [['Campo', 'Detalle']],
            body: [
                ['Nombre Completo (Receptor):', nombre],
                ['Nombre de Usuario (Login):', usuario],
                ['Departamento / Sucursal (Receptor):', depto],
                ['Nombre Completo (Entrega):', nombreEntregador], 
                ['Cargo (Entrega):', cargoEntregador], 
                ['Fecha de Entrega:', fechaEntrega], 
                ['Estado del Equipo:', estado],
                ['Asunto:', 'Entrega de Hardware y Software AUTORIZADO.'],
            ],
            theme: 'striped',
            headStyles: { fillColor: [242, 156, 31], textColor: 255 }, 
            styles: { fontSize: 9, cellPadding: 1.5, lineColor: 150, lineWidth: 0.1 }
        });

        let finalY = doc.autoTable.previous.finalY + 4; 

        // --- 4. REGISTRO DE HARDWARE ---
        doc.setFontSize(12); 
        doc.setFont(undefined, 'bold');
        doc.text('Registro de Hardware Entregado', 14, finalY);
        finalY += 3;

        const hardwareData = [
            ['Tipo de Hardware', 'Laptop'], 
            ['Marca y Modelo', marcaModeloHW], 
            ['Características', caracteristicas],
            ['No. de Serie / IMEI', serie],
            ['Cargador', cargador],
            ['Cable de Seguridad', cableSeguridad]
        ];
        
        doc.autoTable({
            startY: finalY + 3,
            head: [['Unidad', 'Detalle']],
            body: hardwareData,
            theme: 'grid',
            headStyles: { fillColor: [26, 77, 140], textColor: 255 }, 
            styles: { fontSize: 9, cellPadding: 1.5, lineColor: 150, lineWidth: 0.1 }
        });

        finalY = doc.autoTable.previous.finalY + 4;

        // --- 5. REGISTRO DE SOFTWARE (EN TABLA) ---
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text('Registro de Software Instalado', 14, finalY);
        finalY += 3;

        doc.autoTable({
            startY: finalY + 3,
            head: [['Programas Autorizados', '']],
            body: softwareTableData,
            theme: 'grid',
            headStyles: { fillColor: [150, 150, 150], textColor: 255 }, 
            styles: { fontSize: 8, cellPadding: 1.5, lineColor: 150, lineWidth: 0.1 },
            columnStyles: { 0: { cellWidth: 90 }, 1: { cellWidth: 90 } } 
        });

        finalY = doc.autoTable.previous.finalY + 4;


        // --- 6. DECLARACIÓN DE RESPONSABILIDAD ---
        const policyText = "Por medio del presente le estamos entregando una computadora con su software previamente instalado, y que cumple con las regulaciones de protección Intelectual. El uso o instalación de otro software que no sea el autorizado por la Gerencia General, corren bajo su propio riesgo, por lo tanto la instalación de software no autorizado queda terminantemente prohibido y en el caso de haber una revisión de parte de la fiscalía será su responsabilidad responder ante cualquier acción legal. Además la Gerencia General deducirá responsabilidades por la instalación de software no autorizado por la empresa y pérdida o daño que resulten por el uso inadecuado del equipo que se le está entregando.";
        
        doc.setFontSize(8); 
        doc.setFont(undefined, 'bold');
        doc.text("DECLARACIÓN DE POLÍTICA DE USO:", 14, finalY);
        finalY += 1;
        
        doc.setFont(undefined, 'normal');
        const policyLines = doc.splitTextToSize(policyText, 185); 
        doc.text(policyLines, 14, finalY + 4);
        
        finalY += (policyLines.length * 3.5) + 10; 


        // --- 7. ESPACIOS DE FIRMA (POSICIONADO AL PIE DE PÁGINA) ---
        const fixedSignatureY = 245; 
        const signatureImageY = 248; 
        const signatureImageW = 85; 
        const signatureImageH = 12; 
        const lineY = 260; 

        doc.setFontSize(10);
        doc.setFont(undefined, 'bold');
        doc.text('Atentamente,', 25, fixedSignatureY);
        doc.text('Recibí Conforme,', 125, fixedSignatureY);
        
        // CONDICIONAL PARA INSERTAR FIRMAS DIGITALES
        if (includeSignatures) { 
            if (delivererSignatureData) {
                doc.addImage(delivererSignatureData, 'JPEG', 14, signatureImageY, signatureImageW, signatureImageH);
            }
            
            if (receiverSignatureData) {
                doc.addImage(receiverSignatureData, 'JPEG', 114, signatureImageY, signatureImageW, signatureImageH);
            }
        }

        // 2. Dibujar líneas de separación 
        doc.setLineWidth(0.5);
        doc.line(14, lineY, 99, lineY); 
        doc.line(114, lineY, 199, lineY);

        // 3. Colocar Nombres y Títulos (Usando las variables de input)
        let nameY = lineY + 5;

        // Nombre personal de Entrega
        doc.setFont(undefined, 'normal');
        doc.text(nombreEntregador, 20, nameY); 
        // Nombre Receptor
        doc.text(nombre, 120, nameY); 
        nameY += 5;

        // Entregador: "Departamento: [Cargo]"
        doc.text(`Departamento: ${cargoEntregador}`, 20, nameY); 
        
        // Receptor: "Departamento: [Depto]"
        doc.text(`Departamento: ${depto}`, 120, nameY); 


        // --- 8. GUARDAR PDF ---
        doc.save(`Registro_Entrega_${usuario}_${todayShort}${includeSignatures ? '' : '_SinFirma'}.pdf`);
    }
</script>

</body>
</html>
