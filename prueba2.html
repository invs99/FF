<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Mantenimiento IT - Freund</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .signature-container { border: 2px dashed #cbd5e1; border-radius: 1rem; background: #ffffff; touch-action: none; position: relative; }
        #modalFirmas { display: none; }
        canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: crosshair; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20 font-sans text-slate-800">

    <div class="max-w-2xl mx-auto p-4">
        <div class="bg-white p-6 rounded-t-3xl shadow-sm text-center border-b border-slate-200">
            <img src="https://invs99.github.io/FF/freund1.png" alt="Logo Freund" class="h-12 mx-auto mb-3">
            <h1 class="text-xl font-black text-slate-700 uppercase tracking-tighter">Reporte de Mantenimiento IT</h1>
        </div>

        <div class="bg-white p-6 rounded-b-3xl shadow-xl space-y-6">
            <div class="grid grid-cols-1 gap-4">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Nombre de la Sucursal</label>
                    <input type="text" id="sucursal" oninput="saveCache()" class="w-full bg-transparent font-bold outline-none text-slate-700 uppercase" placeholder="Ej: SANTA ANA">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Técnico Responsable</label>
                        <input type="text" id="tecnico" oninput="saveCache()" class="w-full bg-transparent font-bold outline-none uppercase text-xs" placeholder="Nombre">
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Nombre de quien recibe</label>
                        <input type="text" id="receptor" oninput="saveCache()" class="w-full bg-transparent font-bold outline-none uppercase text-xs" placeholder="Nombre">
                    </div>
                </div>
            </div>

            <hr>

            <div class="bg-slate-50 p-5 rounded-3xl border border-slate-200 shadow-md">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-2">
                    <div>
                        <label class="text-[9px] font-black text-slate-500 uppercase">Tipo de Equipo</label>
                        <select id="tipoEquipo" onchange="adaptarInterfaz()" class="w-full p-3 rounded-2xl mt-1 font-bold text-sm">
                            <option value="VENTA">TERMINALES DE VENTA (1-45)</option>
                            <option value="ADMINISTRATIVAS">ESTACIONES ADMINISTRATIVAS / MRO</option>
                            <option value="POS">CAJAS REGISTRADORAS POS (1-10)</option>
                            <option value="ETIQUETA">IMPRESORAS DE ETIQUETAS</option>
                            <option value="LASER">IMPRESORAS LÁSER</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[9px] font-black text-slate-500 uppercase">Identificador(es)</label>
                        <div id="inputIDContainer" class="mt-1"></div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="text-[9px] font-black text-slate-500 uppercase">Observaciones Detalladas</label>
                    <input type="text" id="comentario" class="w-full p-3 rounded-2xl mt-1 text-sm font-semibold italic" placeholder="...">
                </div>
                <div class="space-y-3 mb-6">
                    <label class="flex items-center gap-3 bg-white p-3 rounded-2xl border border-slate-100 cursor-pointer">
                        <input type="checkbox" id="no_existe" onchange="togglePerifericos()" class="w-5 h-5 accent-blue-600">
                        <span class="text-[10px] font-black text-slate-600 uppercase italic text-red-500">⚠️ El equipo NO existe en sucursal</span>
                    </label>
                    <div id="seccionPerifericos" class="grid grid-cols-3 gap-2">
                        <label class="bg-white p-2 rounded-xl text-[9px] font-bold border border-slate-100 uppercase flex items-center gap-1"><input type="checkbox" id="m_f"> Mouse</label>
                        <label class="bg-white p-2 rounded-xl text-[9px] font-bold border border-slate-100 uppercase flex items-center gap-1"><input type="checkbox" id="t_f"> Teclado</label>
                        <label class="bg-white p-2 rounded-xl text-[9px] font-bold border border-slate-100 uppercase flex items-center gap-1"><input type="checkbox" id="s_f"> Scanner</label>
                    </div>
                </div>
                <button onclick="procesarGuardado()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">Añadir al Reporte</button>
            </div>

            <div id="listaNovedades" class="space-y-2"></div>

            <div class="space-y-3 pt-4">
                <button onclick="exportarPDF(false)" class="w-full bg-[#CC0000] text-white font-black py-3 rounded-2xl shadow-md uppercase text-xs italic active:scale-95 transition-all">
                    <i class="fas fa-file-pdf mr-2"></i> Generar Reporte (sin firmas)
                </button>
                <button onclick="abrirModalFirmas()" class="w-full bg-indigo-600 text-white font-black py-3 rounded-2xl shadow-md uppercase text-xs italic active:scale-95 transition-all">
                    <i class="fas fa-pen-fancy mr-2"></i> Generar Reporte (Firmado)
                </button>
                <button onclick="nuevoReporte()" class="w-full bg-gray-500 text-white font-black py-3 rounded-2xl shadow-md uppercase text-xs active:scale-95 transition-all">
                    <i class="fas fa-redo-alt mr-2"></i> Nuevo Reporte
                </button>
                <button onclick="window.location.href='index.html'" class="w-full bg-sky-500 text-white font-black py-3 rounded-2xl shadow-md uppercase text-xs active:scale-95 transition-all">
                    <i class="fas fa-home mr-2"></i> Inicio
                </button>
            </div>
        </div>
    </div>

    <div id="modalFirmas" class="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4">
            <h2 class="text-center font-black uppercase text-slate-700">Firmar Documento</h2>
            <div>
                <label class="text-[9px] font-black text-slate-400 uppercase italic">Firma del Técnico:</label>
                <div class="signature-container h-32"><canvas id="padTecnico"></canvas></div>
                <button onclick="padTecnico.clear()" class="text-[9px] font-bold text-red-500 uppercase mt-1">Limpiar</button>
            </div>
            <div>
                <label class="text-[9px] font-black text-slate-400 uppercase italic">Firma de quien recibe:</label>
                <div class="signature-container h-32"><canvas id="padReceptor"></canvas></div>
                <button onclick="padReceptor.clear()" class="text-[9px] font-bold text-red-500 uppercase mt-1">Limpiar</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="cerrarModalFirmas()" class="bg-slate-200 py-3 rounded-xl font-bold uppercase text-xs text-slate-600">Cancelar</button>
                <button onclick="exportarPDF(true)" class="bg-indigo-600 text-white py-3 rounded-xl font-black uppercase text-xs">Guardar PDF</button>
            </div>
        </div>
    </div>

    <script>
        const listaAdmin = ["MRO1", "MRO2", "MRO3", "MRO4", "MRO5", "LIDER", "ADMON 1", "ADMON 2", "OPERACIONES", "SISMERCHAN", "TRANSPORTE", "CONSTRUCCIÓN", "SISTEMAS", "RECEPCIÓN"];
        const listaEtiquetas = ["SALA DE RECIBO", "RECEPCIÓN", "FONTANERÍA", "HERRAJE", "ELÉCTRICO", "PINTURAS", "HERRAMIENTAS"];
        const listaLaser = ["SISTEMAS", "RECEPCIÓN", "CONSTRUCCIÓN", "SALA DE RECIBO", "VENTAS DIRECTAS"];
        let dbMaster = { venta: {}, admin: {}, pos: {}, etiqueta: {}, laser: {} };
        let padTecnico, padReceptor;

        window.onload = () => {
            loadCache();
            padTecnico = new SignaturePad(document.getElementById('padTecnico'), { penColor: "rgb(0, 0, 128)" });
            padReceptor = new SignaturePad(document.getElementById('padReceptor'), { penColor: "rgb(0, 0, 128)" });
            adaptarInterfaz();
        };

        function abrirModalFirmas() {
            document.getElementById('modalFirmas').style.display = 'flex';
            setTimeout(() => {
                const elements = [ {p: padTecnico, c: 'padTecnico'}, {p: padReceptor, c: 'padReceptor'} ];
                elements.forEach(item => {
                    const canvas = document.getElementById(item.c);
                    const ratio = Math.max(window.devicePixelRatio || 1, 1);
                    canvas.width = canvas.offsetWidth * ratio;
                    canvas.height = canvas.offsetHeight * ratio;
                    canvas.getContext("2d").scale(ratio, ratio);
                    item.p.clear();
                });
            }, 200);
        }

        function cerrarModalFirmas() { document.getElementById('modalFirmas').style.display = 'none'; }

        function saveCache() {
            const data = { sucursal: document.getElementById('sucursal').value, tecnico: document.getElementById('tecnico').value, receptor: document.getElementById('receptor').value, dbMaster: dbMaster };
            localStorage.setItem('freund_audit_cache', JSON.stringify(data));
        }

        function loadCache() {
            const cache = localStorage.getItem('freund_audit_cache');
            if (cache) {
                const d = JSON.parse(cache);
                document.getElementById('sucursal').value = d.sucursal || "";
                document.getElementById('tecnico').value = d.tecnico || "";
                document.getElementById('receptor').value = d.receptor || "";
                dbMaster = d.dbMaster || dbMaster;
                renderVista();
            }
        }

        function nuevoReporte() { if(confirm("¿Borrar todo el reporte?")) { localStorage.removeItem('freund_audit_cache'); location.reload(); } }

        function adaptarInterfaz() {
            const tipo = document.getElementById('tipoEquipo').value;
            const container = document.getElementById('inputIDContainer');
            const perifericos = document.getElementById('seccionPerifericos');
            perifericos.style.display = (tipo === "VENTA" || tipo === "ADMINISTRATIVAS") ? "grid" : "none";
            if (tipo === "VENTA" || tipo === "POS") {
                container.innerHTML = `<input type="text" id="idEq" class="w-full p-3 rounded-2xl border shadow-inner font-bold text-sm" placeholder="Ej: 1-5, 8">`;
            } else {
                let lista = tipo === "ADMINISTRATIVAS" ? listaAdmin : (tipo === "ETIQUETA" ? listaEtiquetas : listaLaser);
                container.innerHTML = `<select id="idEq" class="w-full p-3 rounded-2xl border shadow-inner font-bold text-sm uppercase">${lista.map(e => `<option value="${e}">${e}</option>`).join('')}</select>`;
            }
        }

        function togglePerifericos() {
            const disable = document.getElementById('no_existe').checked;
            document.querySelectorAll('#seccionPerifericos input').forEach(c => c.disabled = disable);
        }

        function procesarGuardado() {
            const tipo = document.getElementById('tipoEquipo').value;
            const valorInput = document.getElementById('idEq').value;
            if(!valorInput) return alert("Ingrese Identificador");
            const map = { VENTA: 'venta', ADMINISTRATIVAS: 'admin', POS: 'pos', ETIQUETA: 'etiqueta', LASER: 'laser' };
            if (tipo === "VENTA" || tipo === "POS") {
                valorInput.split(',').forEach(p => {
                    p = p.trim();
                    if (p.includes('-')) {
                        const [ini, fin] = p.split('-').map(Number);
                        for(let i = Math.min(ini, fin); i <= Math.max(ini, fin); i++) guardarIndiv(tipo, i.toString(), map[tipo]);
                    } else if(p) guardarIndiv(tipo, p, map[tipo]);
                });
            } else { guardarIndiv(tipo, valorInput, map[tipo]); }
            saveCache(); renderVista();
        }

        function guardarIndiv(tipo, id, cat) {
            dbMaster[cat][id] = { tipoRef: tipo, noExiste: document.getElementById('no_existe').checked, m: document.getElementById('m_f').checked, t: document.getElementById('t_f').checked, s: document.getElementById('s_f').checked, obs: document.getElementById('comentario').value };
        }

        function renderVista() {
            const cont = document.getElementById('listaNovedades'); cont.innerHTML = '';
            for(let cat in dbMaster) {
                for(let k in dbMaster[cat]) {
                    const item = dbMaster[cat][k];
                    cont.innerHTML += `<div class="bg-blue-50 p-2 rounded-xl text-[10px] font-bold border flex justify-between uppercase"><span>${item.tipoRef}: ${k} - ${item.noExiste?'NO EXISTE':'OK'}</span><i class="fas fa-trash-alt text-red-400 p-1" onclick="deleteItem('${cat}', '${k}')"></i></div>`;
                }
            }
        }

        function deleteItem(cat, k) { delete dbMaster[cat][k]; saveCache(); renderVista(); }

        function exportarPDF(conFirmas) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ format: 'letter' });
            const tec = document.getElementById('tecnico').value;
            const suc = document.getElementById('sucursal').value;
            const rec = document.getElementById('receptor').value;
            const celesteFreund = [14, 165, 233];

            const img = new Image();
            img.src = "https://invs99.github.io/FF/freund1.png";
            img.crossOrigin = "anonymous";

            img.onload = function() {
                const head = () => {
                    doc.addImage(img, 'PNG', 15, 5, 36, 15.6);
                    doc.setFontSize(13); doc.setFont("helvetica", "bold");
                    doc.text("MANTENIMIENTO PREVENTIVO TI", 65, 11);
                    doc.setFontSize(6.5); doc.setFont("helvetica", "bold");
                    doc.text("REDES SOPORTE Y", 195, 10, {align: "right"});
                    doc.text("TELECOMUNICACIONES", 195, 13, {align: "right"});
                    doc.setFontSize(8); doc.setFont("helvetica", "normal");
                    doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 195, 18, {align: "right"});
                    doc.line(15, 20, 195, 20);
                    doc.setFontSize(9);
                    doc.text(`SUCURSAL: ${suc.toUpperCase()}`, 15, 25);
                    doc.text(`TÉCNICO: ${tec.toUpperCase()}`, 15, 30);
                };

                const icons = (d) => {
                    if (d.section === 'body') {
                        if (d.cell.text[0] === "OK") { doc.setTextColor(0, 120, 0); d.cell.text = ["\u2713"]; }
                        else if (d.cell.text[0] === "X") { doc.setTextColor(200, 0, 0); }
                    }
                };

                head();
                const rowsV = [];
                for(let i=1; i<=45; i++){
                    const d = dbMaster.venta[i]; if(d && d.noExiste) continue;
                    let m="OK", t="OK", s="OK", o="";
                    if(d){ if(d.m) m="X"; if(d.t) t="X"; if(d.s) s="X"; o=d.obs; }
                    rowsV.push([`Terminal de Venta ${i}`, m, t, s, "OK", o]);
                }
                doc.text("1. TERMINALES DE VENTA WINDOWS", 15, 35);
                doc.autoTable({ startY: 37, head:[['Identificador','Mouse','Teclado','Scanner','Mantenimiento','Observaciones']], body:rowsV, styles:{fontSize:7.2, cellPadding:1}, headStyles:{fillColor: celesteFreund}, didDrawCell: icons });

                doc.addPage(); head();
                const rowsA = [];
                listaAdmin.forEach(n => {
                    const d = dbMaster.admin[n]; if(d && d.noExiste) return;
                    let m="OK", t="OK", s="OK", o="";
                    if(d){ if(d.m) m="X"; if(d.t) t="X"; if(d.s) s="X"; o=d.obs; }
                    rowsA.push([n, m, t, s, "OK", o]);
                });
                doc.text("2. ESTACIONES ADMINISTRATIVAS / MRO", 15, 35);
                doc.autoTable({ startY: 37, head:[['Equipo','Mouse','Teclado','Scanner','Mantenimiento','Observaciones']], body:rowsA, styles:{fontSize:8}, headStyles:{fillColor: celesteFreund}, didDrawCell: icons });

                const rowsP = [];
                for(let i=1; i<=10; i++){
                    const d = dbMaster.pos[i]; if(d && d.noExiste) continue;
                    rowsP.push([`Caja POS ${i}`, "OK", "OK", "OK", d?d.obs:""]);
                }
                doc.text("3. CAJAS REGISTRADORAS POS", 15, doc.lastAutoTable.finalY + 10);
                doc.autoTable({ startY: doc.lastAutoTable.finalY + 12, head:[['Identificador','Impresor','Scanner POS','Mantenimiento','Observaciones']], body:rowsP, styles:{fontSize:8}, headStyles:{fillColor: celesteFreund}, didDrawCell: icons });

                doc.addPage(); head();
                const rowsE = [];
                listaEtiquetas.forEach(n => {
                    const d = dbMaster.etiqueta[n]; if(d && d.noExiste) return;
                    rowsE.push([n, "OK", d?d.obs:""]);
                });
                doc.text("4. IMPRESORAS DE ETIQUETAS", 15, 35);
                doc.autoTable({ startY: 37, head:[['Ubicación','Mantenimiento','Observaciones']], body:rowsE, headStyles:{fillColor: celesteFreund} });

                const rowsL = [];
                listaLaser.forEach(n => {
                    const d = dbMaster.laser[n]; if(d && d.noExiste) return;
                    rowsL.push([n, "OK", d?d.obs:""]);
                });
                doc.text("5. IMPRESORAS LÁSER", 15, doc.lastAutoTable.finalY + 10);
                doc.autoTable({ startY: doc.lastAutoTable.finalY + 12, head:[['Ubicación','Mantenimiento','Observaciones']], body:rowsL, headStyles:{fillColor: celesteFreund} });

                const fY = 250;
                doc.line(25, fY, 85, fY); doc.line(125, fY, 185, fY);
                doc.setFontSize(8);
                doc.text(tec.toUpperCase(), 25, fY + 5); doc.text("TÉCNICO RESPONSABLE", 25, fY + 10);
                doc.text(rec.toUpperCase(), 125, fY + 5); doc.text("RECIBIDO POR", 125, fY + 10);

                if(conFirmas) {
                    doc.addImage(padTecnico.toDataURL(), 'PNG', 35, fY - 22, 35, 18);
                    doc.addImage(padReceptor.toDataURL(), 'PNG', 135, fY - 22, 35, 18);
                }

                const fechaDoc = new Date();
                const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                const nombreArchivo = `Mantenimiento_${suc}_${meses[fechaDoc.getMonth()]}_${fechaDoc.getFullYear()}.pdf`;
                doc.save(nombreArchivo);
                cerrarModalFirmas();
            };
        }
    </script>
</body>
</html>
