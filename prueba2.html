<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento Freund</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

    <nav class="bg-[#CC0000] text-white p-4 shadow-md sticky top-0">
        <h1 class="text-center font-bold italic tracking-wider">FREUND TI - APP</h1>
    </nav>

    <div class="p-4">
        <input type="text" id="bus" onkeyup="buscar()" placeholder="Buscar equipo o tienda..." 
               class="w-full p-4 rounded-xl border-none shadow mb-4 outline-none focus:ring-2 focus:ring-red-500">

        <div id="lista" class="space-y-3">
            <div class="text-center py-10 text-gray-400">
                <i class="fas fa-sync fa-spin text-2xl mb-2"></i>
                <p>Cargando datos de Google Sheets...</p>
            </div>
        </div>
    </div>

    <script>
        // TU URL DE GOOGLE (YA CONECTADA)
        const URL_GOOGLE = "https://script.google.com/macros/s/AKfycbzwzXhI0tjQvVgDOILYNvwJWDXJ8RmrFuqGErJlRvEY89GlE8YMcw_2izroTp77t8u99w/exec";
        
        let datosFull = [];

        // Cargar equipos
        fetch(URL_GOOGLE)
            .then(res => res.json())
            .then(json => {
                datosFull = json;
                dibujar(datosFull);
            })
            .catch(err => {
                document.getElementById('lista').innerHTML = `<p class="text-center text-red-500">Error: Verifica que publicaste el Script como 'Cualquier persona'</p>`;
            });

        function dibujar(datos) {
            const contenedor = document.getElementById('lista');
            contenedor.innerHTML = '';
            datos.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow flex justify-between items-center border-l-4 border-red-600";
                card.innerHTML = `
                    <div>
                        <p class="font-bold text-gray-800">${item.equipo}</p>
                        <p class="text-[10px] text-red-600 font-bold uppercase">${item.sucursal}</p>
                    </div>
                    <button onclick="marcar('${item.sucursal}', ${item.fila})" class="bg-green-500 text-white px-5 py-2 rounded-lg font-bold active:scale-90 transition-transform">OK</button>
                `;
                contenedor.appendChild(card);
            });
        }

        function buscar() {
            const filtro = document.getElementById('bus').value.toLowerCase();
            const filtrados = datosFull.filter(d => d.equipo.toLowerCase().includes(filtro) || d.sucursal.toLowerCase().includes(filtro));
            dibujar(filtrados);
        }

        function marcar(suc, fila) {
            const obs = prompt("¿Observaciones para este equipo?");
            if (obs === null) return;
            
            alert("Enviando a Excel...");
            fetch(`${URL_GOOGLE}?sucursal=${suc}&fila=${fila}&nota=${obs}`)
                .then(() => {
                    alert("¡Actualizado!");
                    location.reload();
                });
        }
    </script>
</body>
</html>
