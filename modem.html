<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrega de Módem - Freund</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- PDF.js para renderizar la vista previa universal en alta definición -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        #signatureCanvas {
            border: 2px dashed #cbd5e1;
            border-radius: 0.5rem;
            background-color: white;
            cursor: crosshair;
            touch-action: none;
        }
        #signatureCanvasContainer {
            min-height: 150px;
        }
        .modal-overlay {
            z-index: 999;
        }
        .main-content {
            z-index: 10;
        }
        /* Estilos exactos del visor de previsualización de tus otras web */
        #previewModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content-preview {
            background: #fff;
            width: 100%;
            max-width: 850px;
            height: 90vh;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-header-preview {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .close-modal-preview {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: auto;
            margin: 0;
            padding: 0;
        }
        #pdfContainer {
            flex: 1;
            overflow-y: auto;
            background: #525659;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pdf-page-canvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            max-width: 100%;
            height: auto !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            background: white;
        }
        .modal-footer-preview {
            padding: 12px 20px;
            background: #f1f1f1;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-footer-preview button {
            width: auto;
            padding: 10px 20px;
            margin: 0;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start py-6 px-3 font-sans text-slate-800">

    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-[998] hidden">

            </svg>

            <div class="bg-slate-50/70 p-4 rounded-2xl border border-slate-100 space-y-3">

            <div class="space-y-2.5 pt-2">
                <!-- Botón de Previsualización HD -->
                <button type="button" id="btnPreviewDoc" class="w-full flex justify-center items-center space-x-2 py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-emerald-600/20 text-xs sm:text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none transition active:scale-95 uppercase tracking-wide">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>

                <button type="submit" class="w-full flex justify-center items-center space-x-2 py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-blue-600/20 text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>

        <div class="text-center text-[10px] text-slate-400 mt-4 uppercase font-semibold">Powered by Jonathann</div>

    <div id="messageBox" class="fixed bottom-4 right-4 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-xl z-50 hidden text-xs font-bold">
        Documento generado con éxito.
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let currentPdfDoc = null;

        function showMessage(message, type = 'success') {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            if (type === 'success') {
                messageBox.className = 'fixed bottom-4 right-4 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-xl z-50 text-xs font-bold';
            } else if (type === 'error') {
                messageBox.className = 'fixed bottom-4 right-4 bg-rose-600 text-white px-6 py-3 rounded-2xl shadow-xl z-50 text-xs font-bold';
            }
            messageBox.classList.remove('hidden');
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 3000);
        }

        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let hasSigned = false;

        function drawPlaceholder() {
            if (!hasSigned) {
                ctx.save();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const x = canvas.width / 2;
                const y = canvas.height / 2;
                ctx.fillText('Introducir firma', x, y);
                ctx.restore();
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('signatureCanvasContainer');
            const newWidth = container.offsetWidth;
            const newHeight = 150;
            canvas.width = newWidth;
            canvas.height = newHeight;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, newWidth, newHeight);
            if (!hasSigned) {
                drawPlaceholder();
            } else {
                const savedData = localStorage.getItem('documentFormData');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    if (data.signature) {
                        const img = new Image();
                        img.onload = function() {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = data.signature;
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        function draw(e) {
            if (!isDrawing) return;
            if (!hasSigned) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                hasSigned = true;
            }
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.stroke();
            [lastX, lastY] = [x, y];
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            [lastX, lastY] = [e.clientX - rect.left, e.clientY - rect.top];
        });
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            [lastX, lastY] = [e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top];
            e.preventDefault();
        });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        document.getElementById('clearSignatureButton').addEventListener('click', () => {
            document.getElementById('clearSignatureConfirmationModal').classList.remove('hidden');
        });

        const form = document.getElementById('documentForm');
        function saveFormData() {
            const formData = new FormData(form);
            const data = {};
            for (const [key, value] of formData.entries()) {
                data[key] = value;
            }
            if (hasSigned) {
                data.signature = canvas.toDataURL('image/png');
            } else {
                data.signature = null;
            }
            localStorage.setItem('documentFormData', JSON.stringify(data));
        }

        function loadFormData() {
            const savedData = localStorage.getItem('documentFormData');
            if (savedData) {
                const data = JSON.parse(savedData);
                for (const key in data) {
                    const input = document.getElementById(key);
                    if (input) {
                        input.value = data[key];
                    }
                }
                if (data.signature) {
                    hasSigned = true;
                    const img = new Image();
                    img.onload = function() {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = data.signature;
                } else {
                    hasSigned = false;
                    drawPlaceholder();
                }
            } else {
                hasSigned = false;
                drawPlaceholder();
            }
        }
        form.addEventListener('input', saveFormData);
        window.addEventListener('load', loadFormData);

        // FUNCIÓN ORIGINAL INTACTA PARA GENERAR EL PDF
        async function buildPdfDoc() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            const margin = 15;
            const pageWidth = doc.internal.pageSize.getWidth();
            let y = margin;
            const logoHeight = 17;
            const logoWidth = 34;
            const logoUrl = 'https://raw.githubusercontent.com/invs99/FF/refs/heads/SEGUNDA/freund1.png';
            try {
                const response = await fetch(logoUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const blob = await response.blob();
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                const base64Image = await new Promise((resolve, reject) => {
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                });
                const logoX = margin;
                doc.addImage(base64Image, 'PNG', logoX, y, logoWidth, logoHeight);
            } catch (error) {
                console.warn('No se pudo cargar el logo para el PDF:', error);
            }
            doc.setFontSize(8);
            doc.setFont('helvetica', 'normal');
            const headerX = pageWidth - margin;
            doc.text('Tiendas 01.001.0001.0001', headerX, y, null, null, 'right');
            doc.text('Redes y Telecomunicaciones', headerX, y + 4, null, null, 'right');
            doc.text('Responsable: CC', headerX, y + 8, null, null, 'right');
            doc.text(`Fecha Modificación: ${new Date().toLocaleDateString()}`, headerX, y + 12, null, null, 'right');
            const headerHeight = 15;
            const titleY = y + (Math.max(logoHeight, headerHeight) / 2) + 2;
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text('RENOVACIÓN DE LÍNEA MODEM', pageWidth / 2, titleY, { align: 'center' });
            y = y + Math.max(logoHeight, headerHeight) + 10;
            doc.line(margin, y, pageWidth - margin, y);
            y += 12;
            doc.setFontSize(12);
            doc.setFont('helvetica', 'normal');
            const text = `Recibí de FREUND, S.A. de C.V. un MODEM wifi con las siguientes características:`;
            const splitText = doc.splitTextToSize(text, 180);
            doc.text(splitText, margin, y);
            y += splitText.length * 7;
            y += 10;
            doc.setFontSize(12);
            doc.text(`Marca: ${data.marca || ''}`, margin, y);
            doc.text(`Modelo: ${data.modelo || ''}`, 105, y);
            y += 7;
            doc.text(`IMEI: ${data.imei || ''}`, margin, y);
            doc.text(`Número Telefónico: ${data.numeroTelefonico || ''}`, 105, y);
            y += 7;
            doc.text(`En concepto de: ${data.concepto || ''}`, margin, y);
            y += 20;
            const clause = `El cual recibo completamente nuevo y en perfecto estado con todos sus accesorios, así mismo autorizo al departamento de Recursos Humanos de FREUND, S.A. de C.V. para que de mi salario mensual se me descuente el costo del dispositivo en caso de daño o extravío.`;
            const splitClause = doc.splitTextToSize(clause, 180);
            doc.text(splitClause, margin, y);
            y += splitClause.length * 7 + 30;
            const signatureY = y + 15;
            const signatureData = canvas.toDataURL('image/png');
            if (hasSigned) {
                const signatureWidth = 60;
                const signatureHeight = (canvas.height / canvas.width) * signatureWidth;
                const signatureX = margin;
                const signatureImageY = signatureY - signatureHeight / 2;
                doc.addImage(signatureData, 'PNG', signatureX, signatureImageY, signatureWidth, signatureHeight);
            }
            y = signatureY + 15;
            doc.text(`Nombre: ${data.nombre || ''}`, margin, y);
            y += 7;
            doc.text(`Código empleado: ${data.codigoEmpleado || ''}`, margin, y);
            y += 7;
            doc.text(`Departamento: ${data.departamento || ''}`, margin, y);
            y += 7;
            doc.text(`SSD: ${data.ssd || ''}`, margin, y);
            return doc;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'flex';
            try {
                const doc = await buildPdfDoc();
                const formData = new FormData(e.target);
                const nombre = formData.get('nombre') || 'Documento';
                doc.save(`Documento_Freund_${nombre.replace(/\s/g, '_')}.pdf`);
                loadingOverlay.style.display = 'none';
                showMessage('Documento generado con éxito.', 'success');
            } catch (error) {
                console.error('Error al generar el PDF:', error);
                loadingOverlay.style.display = 'none';
                showMessage('Error al generar el documento.', 'error');
            }
        });

        // Previsualizador HD con PDF.js
        async function renderVerticalPreview(pdfDocObj) {
            const container = document.getElementById('pdfContainer');
            container.innerHTML = ''; 
            for (let i = 1; i <= pdfDocObj.numPages; i++) {
                const page = await pdfDocObj.getPage(i);
                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-page-canvas';
                container.appendChild(canvas);
                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 2.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            }
        }

        document.getElementById('btnPreviewDoc').addEventListener('click', async () => {
            document.getElementById('loadingText').textContent = 'Cargando vista previa ultra nítida...';
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                currentPdfDoc = await buildPdfDoc();
                const pdfArrayBuffer = currentPdfDoc.output('arraybuffer');
                const pdfPdfDocObj = await pdfjsLib.getDocument({ data: pdfArrayBuffer }).promise;
                await renderVerticalPreview(pdfPdfDocObj);
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('previewModal').style.display = 'flex';
            } catch (err) {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('Ocurrió un error al previsualizar el PDF.');
            }
        });

        const cerrarModalPreview = () => document.getElementById('previewModal').style.display = 'none';
        document.getElementById('closePreviewBtn').addEventListener('click', cerrarModalPreview);
        document.getElementById('closePreviewBottomBtn').addEventListener('click', cerrarModalPreview);
        document.getElementById('downloadFromPreviewBtn').addEventListener('click', () => {
            if (currentPdfDoc) {
                const formData = new FormData(form);
                const nombre = formData.get('nombre') || 'Documento';
                currentPdfDoc.save(`Documento_Freund_${nombre.replace(/\s/g, '_')}.pdf`);
            }
        });

        document.getElementById('clearFormButton').addEventListener('click', function() {
            document.getElementById('confirmationModal').classList.remove('hidden');
        });
        document.getElementById('cancelClearButton').addEventListener('click', function() {
            document.getElementById('confirmationModal').classList.add('hidden');
        });
        document.getElementById('confirmClearButton').addEventListener('click', function() {
            document.getElementById('documentForm').reset();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            hasSigned = false;
            drawPlaceholder();
            document.getElementById('confirmationModal').classList.add('hidden');
            showMessage('Formulario limpiado. Listo para un nuevo documento.', 'success');
            localStorage.removeItem('documentFormData');
        });
        document.getElementById('cancelClearSignatureButton').addEventListener('click', function() {
            document.getElementById('clearSignatureConfirmationModal').classList.add('hidden');
        });
        document.getElementById('confirmClearSignatureButton').addEventListener('click', function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            hasSigned = false;
            drawPlaceholder();
            saveFormData();
            document.getElementById('clearSignatureConfirmationModal').classList.add('hidden');
            showMessage('Firma borrada.', 'success');
        });
    </script>
</body>
</html>
