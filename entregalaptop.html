<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Política de Aceptación de Equipo Informático - Freund</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        .signature-canvas {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            background-color: white;
            cursor: crosshair;
            touch-action: none;
        }
        input[type="text"], select {
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-3 text-sm font-sans">

    <!-- Overlay de Carga -->
    <div id="loadingOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-5 rounded-lg shadow-xl flex items-center space-x-3">
            <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-800 font-bold text-xs">Generando PDF oficial exacto...</p>
        </div>
    </div>

    <!-- Contenedor Web Amigable para Celular -->
    <div class="max-w-md mx-auto bg-white p-4 rounded-xl shadow-md space-y-5 my-4">
        <div class="text-center">
            <img src="https://raw.githubusercontent.com/invs99/FF/refs/heads/SEGUNDA/freund1.png" alt="Freund" class="h-10 mx-auto mb-2 object-contain" />
            <h1 class="text-base font-bold text-gray-800 uppercase">Política de Aceptación de Equipo</h1>
            <p class="text-xs text-gray-500">Formulario de Entrega y Firmas Digitales</p>
        </div>

        <form id="documentForm" class="space-y-4">
            
            <!-- DATOS DEL USUARIO -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-3">
                <h2 class="font-bold text-blue-900 text-xs border-b pb-1 uppercase">Datos del Usuario</h2>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Código de empleado</label>
                    <input type="text" id="codigoEmpleado" value="19281" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border text-xs bg-white" required />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Nombre completo</label>
                    <input type="text" id="nombre" value="DANIEL ALBERTO ALVAREZ OCHOA" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border text-xs bg-white font-semibold" required />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Departamento / Área / Tienda</label>
                    <input type="text" id="departamento" value="VENTA TELEFÓNICA OCCIDENTE" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border text-xs bg-white" required />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Cargo</label>
                    <input type="text" id="cargo" value="REPRESENTANTE DE VENTAS" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border text-xs bg-white" required />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Usuario Correo corporativo</label>
                    <div class="flex items-center mt-1">
                        <input type="text" id="correoUser" value="ALVAREZD" class="block w-full rounded-l-md border-gray-300 shadow-sm p-2 border text-xs bg-white font-semibold" placeholder="usuario" required />
                        <span class="inline-flex items-center px-2 py-2 rounded-r-md border border-l-0 border-gray-300 bg-gray-200 text-gray-600 text-xs font-bold">@freundsa.com</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Estado del equipo</label>
                    <select id="estado" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border text-xs bg-white font-semibold">
                        <option value="NUEVO" selected>NUEVO</option>
                        <option value="USADO">USADO</option>
                        <option value="REASIGNADO">REASIGNADO</option>
                        <option value="USADO EXCELENTE ESTADO">USADO EXCELENTE ESTADO</option>
                        <option value="USADO ACEPTABLE">USADO ACEPTABLE</option>
                    </select>
                </div>
            </div>

            <!-- HARDWARE -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-3">
                <h2 class="font-bold text-blue-900 text-xs border-b pb-1 uppercase">Detalles del Equipo (Laptop)</h2>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Laptop (Marca / Modelo / Serie)</label>
                    <div class="grid grid-cols-3 gap-1 mt-1">
                        <input type="text" id="laptopMarca" value="LENOVO" class="border p-1 rounded text-xs bg-white" placeholder="Marca" />
                        <input type="text" id="laptopModelo" value="THINKPAD E14 GEN 7" class="border p-1 rounded text-xs bg-white" placeholder="Modelo" />
                        <input type="text" id="laptopSerie" value="PF-5WQPNE" class="border p-1 rounded text-xs bg-white" placeholder="Serie" />
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Cargador (Marca / Modelo / Serie)</label>
                    <div class="grid grid-cols-3 gap-1 mt-1">
                        <input type="text" id="cargadorMarca" value="LENOVO" class="border p-1 rounded text-xs bg-white" placeholder="Marca" />
                        <input type="text" id="cargadorModelo" value="TYPE-C" class="border p-1 rounded text-xs bg-white" placeholder="Modelo" />
                        <input type="text" id="cargadorSerie" value="ADLX65YCC2E" class="border p-1 rounded text-xs bg-white" placeholder="Serie" />
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Cable de Seguridad (Marca / Modelo / Serie)</label>
                    <div class="grid grid-cols-3 gap-1 mt-1">
                        <input type="text" id="cableMarca" value="LENOVO" class="border p-1 rounded text-xs bg-white" placeholder="Marca" />
                        <input type="text" id="cableModelo" value="NANO" class="border p-1 rounded text-xs bg-white" placeholder="Modelo" />
                        <input type="text" id="cableSerie" value="" class="border p-1 rounded text-xs bg-white" placeholder="N/S" />
                    </div>
                </div>
            </div>

            <!-- SELECCIÓN DE SOFTWARES INSTALADOS -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-3">
                <h2 class="font-bold text-blue-900 text-xs border-b pb-1 uppercase">5. Softwares Instalados</h2>
                <p class="text-[11px] text-gray-500">Seleccione los programas instalados en el equipo:</p>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_win11" checked class="rounded text-blue-600" /> <span>Windows 11</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_bitlocker" checked class="rounded text-blue-600" /> <span>BitLocker</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_trend" checked class="rounded text-blue-600" /> <span>Trend Micro OfficeScan</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_chrome" checked class="rounded text-blue-600" /> <span>Google Chrome</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_acrobat" checked class="rounded text-blue-600" /> <span>Acrobat Reader</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_rapid7" checked class="rounded text-blue-600" /> <span>Rapid7</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_libreoffice" checked class="rounded text-blue-600" /> <span>Libre Office</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_firefox" class="rounded text-blue-600" /> <span>Mozilla Firefox</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_zoom" checked class="rounded text-blue-600" /> <span>Zoom</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_endpoint" checked class="rounded text-blue-600" /> <span>Endpoint Central</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_office365" class="rounded text-blue-600" /> <span>Microsoft Office 365</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_netskope" checked class="rounded text-blue-600" /> <span>Netskope</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_cortex" class="rounded text-blue-600" /> <span>Cortex XDR</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_vpn" checked class="rounded text-blue-600" /> <span>VPN</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_gfi" class="rounded text-blue-600" /> <span>GFI Endpoint Security</span></label>
                    <label class="flex items-center space-x-1.5"><input type="checkbox" id="sw_citrix" class="rounded text-blue-600" /> <span>Citrix Workspace</span></label>
                </div>
            </div>

            <!-- RESPONSABLES -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-3">
                <h2 class="font-bold text-blue-900 text-xs border-b pb-1 uppercase">Técnico Emisor</h2>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Nombre del Técnico</label>
                    <input type="text" id="tecnicoNombre" value="JONATHAN NAVAS" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border text-xs bg-white mb-1 font-semibold" required />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Usuario del Técnico (ej: JONATHANN)</label>
                    <input type="text" id="tecnicoUser" value="JONATHANN" class="block w-full rounded-md border-gray-300 shadow-sm p-2 border text-xs bg-white" required />
                </div>
            </div>

            <!-- FIRMAS DIGITALES WEB -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-4">
                <h2 class="font-bold text-blue-900 text-xs border-b pb-1 uppercase">Área de Firmas Digitales</h2>
                
                <!-- Firma Técnico -->
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Firma del Técnico Emisor</label>
                    <div class="border rounded-md p-1 relative w-full bg-white">
                        <canvas id="canvasTecnico" class="signature-canvas w-full h-28"></canvas>
                    </div>
                    <button type="button" id="clearTecnicoBtn" class="mt-1 py-1 px-2 border border-red-300 rounded text-xs text-red-700 bg-red-50 hover:bg-red-100">Borrar Firma Técnico</button>
                </div>

                <!-- Firma Usuario -->
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Firma del Colaborador (Usuario)</label>
                    <div class="border rounded-md p-1 relative w-full bg-white">
                        <canvas id="canvasUsuario" class="signature-canvas w-full h-28"></canvas>
                    </div>
                    <button type="button" id="clearUsuarioBtn" class="mt-1 py-1 px-2 border border-red-300 rounded text-xs text-red-700 bg-red-50 hover:bg-red-100">Borrar Firma Usuario</button>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN PRINCIPALES -->
            <div class="pt-2 space-y-2">
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition">GENERAR PDF OFICIAL (5 PÁGINAS)</button>
                
                <!-- Botón Nuevo Documento Rojizo -->
                <button type="button" id="btnNuevoDoc" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-md text-xs font-bold text-white bg-red-600 hover:bg-red-700 focus:outline-none transition">NUEVO DOCUMENTO</button>
                
                <!-- Botón Inicio Celeste -->
                <a href="https://invs99.github.io/FF/" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-md text-xs font-bold text-white bg-cyan-500 hover:bg-cyan-600 text-center transition">INICIO</a>
            </div>
        </form>
    </div>

    <script>
        // Transformación automática a MAYÚSCULAS en tiempo real
        document.querySelectorAll('input[type="text"]').forEach(input => {
            input.addEventListener('input', () => {
                input.value = input.value.toUpperCase();
            });
        });

        // Configuración de Lienzos de Firma
        const setupCanvas = (canvasId) => {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            let hasSigned = false;

            const resize = () => {
                const container = canvas.parentElement;
                canvas.width = container.clientWidth - 8;
                canvas.height = 100;
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (!hasSigned) drawPlaceholder(canvas, ctx);
            };

            const drawPlaceholder = (cv, cx) => {
                cx.fillStyle = '#9CA3AF';
                cx.font = '12px sans-serif';
                cx.textAlign = 'center';
                cx.textBaseline = 'middle';
                cx.fillText('Firme aquí con su dedo o ratón', cv.width / 2, cv.height / 2);
            };

            window.addEventListener('load', resize);
            window.addEventListener('resize', resize);

            const start = (e) => {
                isDrawing = true;
                if (!hasSigned) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    hasSigned = true;
                }
                draw(e);
            };

            const stop = () => { isDrawing = false; ctx.beginPath(); };

            const draw = (e) => {
                if (!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#000000';
                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
            };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('touchstart', (e) => { start(e); e.preventDefault(); });
            canvas.addEventListener('touchend', stop);
            canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

            return {
                canvas,
                ctx,
                get hasSigned() { return hasSigned; },
                clear: () => {
                    hasSigned = false;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    drawPlaceholder(canvas, ctx);
                }
            };
        };

        const sigTecnico = setupCanvas('canvasTecnico');
        const sigUsuario = setupCanvas('canvasUsuario');

        document.getElementById('clearTecnicoBtn').addEventListener('click', sigTecnico.clear);
        document.getElementById('clearUsuarioBtn').addEventListener('click', sigUsuario.clear);

        // BOTÓN "NUEVO DOCUMENTO"
        document.getElementById('btnNuevoDoc').addEventListener('click', () => {
            if (confirm('¿Desea limpiar todos los campos para ingresar un nuevo documento?')) {
                document.getElementById('documentForm').reset();
                sigTecnico.clear();
                sigUsuario.clear();
            }
        });

        // GENERADOR DEL PDF DE 5 PÁGINAS EXACTO
        document.getElementById('documentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('loadingOverlay').classList.remove('hidden');

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'letter' });
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                const margin = 18;
                let y = margin;

                const addHeaderNum = (pageNum) => {
                    doc.setFont('times', 'normal');
                    doc.setFontSize(10);
                    doc.setTextColor(0, 0, 0);
                    doc.text(`Página ${pageNum} de 5`, pageWidth - margin, 15, { align: 'right' });
                };

                // --- PÁGINA 1: PORTADA CON LETRA MÁS GRANDE Y MEJOR ESPACIADO ---
                try {
                    const response = await fetch('https://raw.githubusercontent.com/invs99/FF/refs/heads/SEGUNDA/freund1.png');
                    if (response.ok) {
                        const blob = await response.blob();
                        const base64Image = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onloadend = () => resolve(reader.result);
                            reader.readAsDataURL(blob);
                        });
                        doc.addImage(base64Image, 'PNG', margin, y, 56, 26);
                    }
                } catch (err) {}

                doc.setFont('times', 'bold');
                doc.setFontSize(20);
                doc.text('Política de aceptación de', pageWidth - margin, y + 10, { align: 'right' });
                doc.text('equipo informático', pageWidth - margin, y + 18, { align: 'right' });

                y += 55;

                // Letras más grandes y espaciado idéntico a Captura_5.PNG
                let metaY = y;
                const printMeta = (label, val) => {
                    doc.setFont('times', 'normal');
                    doc.setFontSize(14); // Aumentado el tamaño de letra
                    doc.setTextColor(0, 0, 0);
                    doc.text(label, margin + 25, metaY);
                    
                    const lw = doc.getTextWidth(label);
                    doc.setTextColor(0, 150, 220); // Azul exacto corporativo
                    doc.text(val, margin + 25 + lw + 2, metaY);
                    metaY += 10.5; // Espaciado mayor
                };

                printMeta('Código: ', 'IT.IN.PO.002');
                printMeta('Versión: ', '001');
                printMeta('Equipos informáticos: ', 'Todos');
                printMeta('Gerencia: ', 'Sistemas');
                printMeta('Área: ', 'Ciber seguridad');
                printMeta('Fecha de actualización: ', 'Mayo 2027');

                y += 110;

                doc.autoTable({
                    startY: y,
                    margin: { left: margin, right: margin },
                    head: [['Rol', 'Nombre', 'Cargo', 'Fecha']],
                    body: [
                        ['Elaborador', 'Gerardo Chavez', 'Analista de seguridad', 'Noviembre 2025'],
                        ['Revisor', 'Fernando Girón', 'Jefe de seguridad', 'Noviembre 2025'],
                        ['Autorizado', 'Mario Santacruz', 'Gerente de Infraestructura', 'Noviembre 2025']
                    ],
                    theme: 'grid',
                    styles: { font: 'times', fontSize: 10, cellPadding: 2.2, halign: 'center', textColor: [0, 0, 0] },
                    headStyles: { fillColor: [142, 198, 222], textColor: [0, 0, 0], fontStyle: 'bold' }
                });

                // --- PÁGINA 2 ---
                doc.addPage();
                addHeaderNum(2);
                y = 25;

                doc.setFont('times', 'bold');
                doc.setFontSize(11);
                doc.text('1.  OBJETIVO', margin, y);
                y += 5;
                doc.setFont('times', 'normal');
                doc.setFontSize(10);
                let text = 'Establecer lineamientos claros para el uso, resguardo y protección de los equipos informáticos y recursos tecnológicos de la empresa, garantizando la seguridad de la información y el cumplimiento de las normativas internas y legales vigentes.';
                let lines = doc.splitTextToSize(text, pageWidth - (margin * 2));
                doc.text(lines, margin, y);
                y += (lines.length * 4.8) + 6;

                doc.setFont('times', 'bold');
                doc.setFontSize(11);
                doc.text('2.  ALCANCE', margin, y);
                y += 5;
                doc.setFont('times', 'normal');
                doc.setFontSize(10);
                text = 'Esta política aplica a todos los usuarios que utilicen equipos, software o recursos tecnológicos proporcionados por la empresa, durante el desempeño de sus funciones laborales. Incluye la instalación y uso de software autorizado, la conservación de los equipos asignados, y la obligación de reportar cualquier incidente, pérdida o daño.';
                lines = doc.splitTextToSize(text, pageWidth - (margin * 2));
                doc.text(lines, margin, y);
                y += (lines.length * 4.8) + 6;

                doc.setFont('times', 'bold');
                doc.setFontSize(11);
                doc.text('3.  ACUERDOS Y DATOS DEL USUARIO', margin, y);
                y += 7;
                doc.setFontSize(10);

                const printInlineField = (label, value) => {
                    doc.setFont('times', 'normal');
                    doc.setTextColor(0, 0, 0);
                    doc.text(label, margin, y);

                    const labelWidth = doc.getTextWidth(label);
                    const startX = margin + labelWidth + 2;
                    const endX = pageWidth - margin;
                    const lineLength = endX - startX;

                    doc.setFont('times', 'normal');
                    doc.text(value, startX + (lineLength / 2), y, { align: 'center' });

                    doc.setDrawColor(0, 0, 0);
                    doc.setLineWidth(0.3);
                    doc.line(startX, y + 1, endX, y + 1);

                    y += 6.5;
                };

                const hoy = new Date();
                const opcionesFecha = { day: 'numeric', month: 'long', year: 'numeric' };
                const fechaActualStr = hoy.toLocaleDateString('es-ES', opcionesFecha).toUpperCase();

                const userMail = document.getElementById('correoUser').value.trim().toUpperCase();
                const fullEmail = `${userMail}@FREUNDSA.COM`;

                printInlineField('Código de empleado:', document.getElementById('codigoEmpleado').value.toUpperCase());
                printInlineField('Nombre completo:', document.getElementById('nombre').value.toUpperCase());
                printInlineField('Departamento / Área/ Tienda:', document.getElementById('departamento').value.toUpperCase());
                printInlineField('Cargo:', document.getElementById('cargo').value.toUpperCase());
                printInlineField('Correo electrónico corporativo:', fullEmail);
                printInlineField('Fecha de entrega:', fechaActualStr);
                printInlineField('Estado:', document.getElementById('estado').value.toUpperCase());
                y += 4;

                text = `Por este medio, se le hace entrega de un equipo informático corporativo con el software previamente instalado y autorizado por la empresa, conforme a las regulaciones vigentes.
Queda estrictamente prohibida la instalación, uso o descarga de cualquier software adicional que no haya sido debidamente autorizado por el departamento de Sistemas. La instalación de programas no autorizados constituye una infracción a las políticas de seguridad y cumplimiento de la organización, y se considerará una falta grave.
En caso de una revisión por parte de autoridades legales o entidades reguladoras, como la fiscalía general, el usuario asumirá toda responsabilidad legal derivada del uso de software no autorizado en el equipo asignado.
El equipo informático asignado al colaborador es propiedad de la empresa y se entrega para uso exclusivo en el ejercicio de sus funciones laborales. A partir del momento de la recepción, la responsabilidad total por el resguardo, conservación y uso adecuado del equipo recae exclusivamente en el usuario.`;
                lines = doc.splitTextToSize(text, pageWidth - (margin * 2));
                doc.text(lines, margin, y);

                // --- PÁGINA 3 ---
                doc.addPage();
                addHeaderNum(3);
                y = 25;

                text = `En caso de pérdida, extravío, daño total o parcial del equipo asignado, ya sea por uso negligente, descuido, mal manejo, o incumplimiento de las políticas de seguridad establecidas, el colaborador deberá asumir las consecuencias administrativas, económicas y/o disciplinarias correspondiente`;
                lines = doc.splitTextToSize(text, pageWidth - (margin * 2));
                doc.text(lines, margin, y);
                y += (lines.length * 4.8) + 6;

                doc.setFont('times', 'bold');
                doc.setFontSize(11);
                doc.text('4.  DETALLES DEL EQUIPO ENTREGADO', margin, y);
                y += 4;

                doc.autoTable({
                    startY: y,
                    margin: { left: margin, right: margin },
                    head: [['TIPO DE EQUIPO', 'MARCA', 'MODELO', 'NUMERO DE SERIE']],
                    body: [
                        ['Laptop/Desktop', document.getElementById('laptopMarca').value.toUpperCase(), document.getElementById('laptopModelo').value.toUpperCase(), document.getElementById('laptopSerie').value.toUpperCase()],
                        ['Cargador', document.getElementById('cargadorMarca').value.toUpperCase(), document.getElementById('cargadorModelo').value.toUpperCase(), document.getElementById('cargadorSerie').value.toUpperCase()],
                        ['Mouse', '', '', ''],
                        ['Cable de Seguridad', document.getElementById('cableMarca').value.toUpperCase(), document.getElementById('cableModelo').value.toUpperCase(), document.getElementById('cableSerie').value.toUpperCase()],
                        ['Monitor', '', '', ''],
                        ['Accesorios Adicionales', '', '', '']
                    ],
                    theme: 'grid',
                    styles: { font: 'times', fontSize: 9.5, cellPadding: 1.8, textColor: [0, 0, 0] },
                    headStyles: { fillColor: [155, 195, 230], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' }
                });

                y = doc.lastAutoTable.finalY + 6;

                doc.setFont('times', 'bold');
                doc.setFontSize(11);
                doc.text('5.  SOFTWARES INSTALADOS', margin, y);
                y += 4;

                const getSW = (id, nombre) => (document.getElementById(id).checked ? `X   ${nombre}` : `    ${nombre}`);

                doc.autoTable({
                    startY: y,
                    margin: { left: margin, right: margin },
                    head: [['MARCA', 'NUMERO DE SERIE']],
                    body: [
                        [getSW('sw_win11', 'Windows 11'), getSW('sw_bitlocker', 'BitLocker')],
                        [getSW('sw_trend', 'Tren Micro Office Scan'), getSW('sw_chrome', 'Google Chrome')],
                        [getSW('sw_acrobat', 'Acobar Reader'), getSW('sw_rapid7', 'Rapid7')],
                        [getSW('sw_libreoffice', 'Libre Office'), getSW('sw_firefox', 'Mozilla firefox')],
                        [getSW('sw_zoom', 'Zoom'), getSW('sw_endpoint', 'Endpoint Central.')],
                        [getSW('sw_office365', 'Microsoft Office 365'), getSW('sw_netskope', 'Netskope')],
                        [getSW('sw_cortex', 'Cortex XDR'), getSW('sw_vpn', 'VPN')],
                        [getSW('sw_gfi', 'GFI Endpoint Security'), ''],
                        [getSW('sw_citrix', 'Citrix workspace'), '']
                    ],
                    theme: 'grid',
                    styles: { font: 'times', fontSize: 9.5, cellPadding: 1.5, textColor: [0, 0, 0] },
                    headStyles: { fillColor: [155, 195, 230], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' }
                });

                y = doc.lastAutoTable.finalY + 6;

                doc.setFont('times', 'bold');
                doc.setFontSize(11);
                doc.text('6.  RESPONSABILIDADES DEL USUARIO', margin, y);
                y += 4;

                doc.autoTable({
                    startY: y,
                    margin: { left: margin, right: margin },
                    head: [['Número', 'Descripción']],
                    body: [
                        ['1', 'Cuando el usuario sea nuevo, el técnico encargado de la entrega deberá proporcionar la contraseña inicial y cada usuario está obligada a cambiarla y validar el acceso a su equipo.'],
                        ['2', 'El equipo informático provisto por Freund es de uso strictly personal e intransferible. Queda prohibido compartirlo, prestarlo o cederlo a terceros bajo cualquier circunstancia, con excepción del personal autorizado del área de soporte técnico de la organización para fines de mantenimiento, soporte o gestión autorizada.'],
                        ['3', 'Todos los dispositivos móviles utilizados en entornos no supervisados o de acceso compartido deben estar asegurados físicamente mediante un cable de seguridad aprobado.']
                    ],
                    theme: 'grid',
                    styles: { font: 'times', fontSize: 9.5, cellPadding: 1.8, textColor: [0, 0, 0] },
                    headStyles: { fillColor: [155, 195, 230], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' }
                });

                // --- PÁGINA 4 ---
                doc.addPage();
                addHeaderNum(4);
                y = 25;

                doc.autoTable({
                    startY: y,
                    margin: { left: margin, right: margin },
                    head: [['Número', 'Descripción']],
                    body: [
                        ['4', 'El cable de seguridad será provisto por el área de Tl al momento de la entrega del dispositivo, y su uso es responsabilidad directa del usuario.'],
                        ['5', 'En caso de extravío del cable, el usuario deberá notificarlo y solicitar reposición inmediata.'],
                        ['6', 'El resguardo físico de los dispositivos móviles corporativos durante traslados o estancias temporales fuera de la organización es responsabilidad directa del usuario. Por tal motivo están prohibidas las siguientes acciones:\n• Dejar el equipo en el asiento del acompañante, baúl o debajo de los asientos, aunque el vehículo esté cerrado.\n• Dejar equipos sin cable de seguridad o fuera de cajas fuertes en hoteles'],
                        ['7', 'Los equipos de la organización sólo deben usarse para actividades de trabajo y no para otros fines, tales como juegos, pasatiempos, trabajos personales/estudio, entre otros.'],
                        ['8', 'Debe respetarse y no modificar la configuración de hardware y software establecida por el Departamento de Sistemas.'],
                        ['9', 'Los usuarios deben asumir que todo el software la organización están protegidos por derechos de autor y requiere licencia de uso. Por tal razón es ilegal y está terminantemente prohibido hacer copias o usar ese software para fines personales.'],
                        ['10', 'La compañía se reserva el derecho de registrar y monitorear los accesos y el uso de los recursos informáticos e información en cualquier momento sin notificación. El monitoreo puede incluir inspección en su equipo de cómputo por potenciales problemas de seguridad o no aplicación de estas políticas, incluyendo el uso de cualquier información confidencial del usuario o cualquier otra información, datos y documentos grabados en los equipos de cómputo asignados a él.'],
                        ['11', 'La navegación en Internet para fines personales no debe hacerse a expensas del tiempo y los recursos de La Compañía y en tal sentido deben usarse las horas no laborables.'],
                        ['12', 'Se prohíbe el movimiento, reubicación o retiro de equipos sin autorización previa. La salida de cualquier equipo fuera de las instalaciones de la empresa deberá contar con autorización formal emitida por el área soporte.'],
                        ['13', 'Cualquier falla en los computadores o en la red debe reportarse inmediatamente ya que podría causar problemas serios como pérdida de la información o indisponibilidad de los servicios.']
                    ],
                    theme: 'grid',
                    styles: { font: 'times', fontSize: 9.5, cellPadding: 1.8, textColor: [0, 0, 0] },
                    headStyles: { fillColor: [155, 195, 230], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' }
                });

                // --- PÁGINA 5: FIRMAS CON LETRA DISMINUIDA UN 20% ---
                doc.addPage();
                addHeaderNum(5);
                y = 25;

                doc.setFont('times', 'bold');
                doc.setFontSize(11);
                doc.text('7.  SANSIONES', margin, y);
                y += 4;

                doc.autoTable({
                    startY: y,
                    margin: { left: margin, right: margin },
                    head: [['Número', 'Descripción']],
                    body: [
                        ['1', 'Cualquier empleado que se encuentre sin el uso del cable de seguridad en su escritorio o sala de reuniones en una revisión efectuada por el personal de auditoria será sujeto de una acción disciplinaria.'],
                        ['2', 'Cualquier empleado que incumpla esta política será sujeto a una acción disciplinaria, cuya consecuencia pueden llegar hasta la terminación del contrato de empleo.']
                    ],
                    theme: 'grid',
                    styles: { font: 'times', fontSize: 9.5, cellPadding: 1.8, textColor: [0, 0, 0] },
                    headStyles: { fillColor: [155, 195, 230], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' }
                });

                // Bloque de Firmas
                y = pageHeight - 45;

                // Técnico (Izquierda)
                const tecX = margin;
                doc.setDrawColor(0, 0, 0);
                if (sigTecnico.hasSigned) {
                    const sigImgTec = sigTecnico.canvas.toDataURL('image/png');
                    doc.addImage(sigImgTec, 'PNG', tecX + 10, y - 18, 45, 16);
                }
                doc.line(tecX, y, tecX + 65, y);
                doc.setFont('times', 'normal');
                doc.setFontSize(8); // Reducido un 20% (de 10pt a 8pt)
                
                const tNombre = `TÉCNICO: ${document.getElementById('tecnicoNombre').value.toUpperCase()}`;
                let tUser = document.getElementById('tecnicoUser').value.toUpperCase();
                if (!tUser.startsWith('(')) tUser = `(${tUser})`;

                doc.text(tNombre, tecX, y + 4.5);
                doc.text(tUser, tecX, y + 8.5);
                doc.text('TÉCNICO DE SOPORTE FREUND', tecX, y + 12.5);

                // Usuario (Derecha)
                const usrX = pageWidth - margin - 65;
                if (sigUsuario.hasSigned) {
                    const sigImgUsr = sigUsuario.canvas.toDataURL('image/png');
                    doc.addImage(sigImgUsr, 'PNG', usrX + 10, y - 18, 45, 16);
                }
                doc.line(usrX, y, usrX + 65, y);
                
                const uNombre = `USUARIO: ${document.getElementById('nombre').value.toUpperCase()}`;
                const uUser = `( ${userMail} )`;
                const uDepto = `DEPARTAMENTO: ${document.getElementById('departamento').value.toUpperCase()}`;

                doc.text(uNombre, usrX, y + 4.5);
                doc.text(uUser, usrX, y + 8.5);
                doc.text(uDepto, usrX, y + 12.5);

                doc.save(`Politica_Aceptacion_Equipo_${document.getElementById('nombre').value.replace(/\s/g, '_')}.pdf`);
                document.getElementById('loadingOverlay').classList.add('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loadingOverlay').classList.add('hidden');
                alert('Ocurrió un error al generar el PDF.');
            }
        });
    </script>
</body>
</html>
