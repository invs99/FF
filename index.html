<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Utilidades Web - Freund</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start py-8 px-3 font-sans text-slate-800">

    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-8 w-full max-w-md mb-6" id="mainCover">
        <div class="flex flex-col items-center mb-6">
            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 shadow-sm mb-3">
                <img src="https://www.freundferreteria.com/img/logo.svg" alt="Logo Freund" class="h-12 w-auto object-contain" />
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Menú de Utilidades</h1>
            <p class="text-xs text-slate-400 mt-0.5">Soporte Redes y Telecomunicaciones</p>
        </div>
        
        <!-- Botones de Navegación Unificados -->
        <div class="space-y-2.5">
            <button id="btnReporteImpresores" class="w-full flex justify-center items-center py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 uppercase tracking-wide" onclick="window.location.href='reporteimpresores.html'">
                Reporte de Etiquetadores
            </button>
    
            <button id="btnRepositorioReporte" class="w-full flex justify-center items-center py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 uppercase tracking-wide" onclick="window.location.href='Reporte.html'">
                Reporte General
            </button>
            
            <button id="btnEntregaEquipo" class="w-full flex justify-center items-center py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 uppercase tracking-wide" onclick="window.location.href='https://invs99.github.io/FF/entregaequipo.html'">
                Entrega de Equipos
            </button>

            <button id="btnEntregaLaptop" class="w-full flex justify-center items-center py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 uppercase tracking-wide" onclick="window.location.href='https://invs99.github.io/FF/entregalaptop.html'">
                Entrega de Laptop
            </button>

            <button id="btnEntregaCelulares" class="w-full flex justify-center items-center py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 uppercase tracking-wide" onclick="window.location.href='celulares.html'">
                Entrega de Celulares
            </button>

            <button id="btnEntregaModem" class="w-full flex justify-center items-center py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 uppercase tracking-wide" onclick="window.location.href='modem.html'">
                Entrega de Módem
            </button>

            <button id="btnFirmaCorreo" class="w-full flex justify-center items-center py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 uppercase tracking-wide" onclick="window.location.href='firma.html'">
                Firma de Correo
            </button>

            <button id="btnConvertidorImagenes" class="w-full flex justify-center items-center py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95 shadow-md shadow-blue-600/20 uppercase tracking-wide" onclick="window.location.href='convertidor.html'">
                Convertidor de Imágenes a PDF
            </button>
        </div>
        
        <div class="text-center text-[10px] text-slate-400 mt-6 uppercase font-semibold">Powered by Jonathann</div>
    </div>

    <script>
        const mainCover = document.getElementById("mainCover");
        const btnReporteImpresores = document.getElementById("btnReporteImpresores");
        const btnEntregaEquipo = document.getElementById("btnEntregaEquipo");
        const btnEntregaLaptop = document.getElementById("btnEntregaLaptop");
        const btnConvertidorImagenes = document.getElementById("btnConvertidorImagenes");
        const btnEntregaCelulares = document.getElementById("btnEntregaCelulares");
        const btnEntregaModem = document.getElementById("btnEntregaModem");
        const btnFirmaCorreo = document.getElementById("btnFirmaCorreo");
        const btnReporteGerneral = document.getElementById("btnRepositorioReporte");
    </script>
</body>
</html>
