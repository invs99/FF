<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Reporte de Impresores - Freund</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        .contenido-seccion {
            display: none;
        }
        .preview-images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
            gap: 10px;
        }
        .image-container {
            position: relative;
            display: inline-block;
        }
        .preview-images img {
            max-width: 80px;
            max-height: 80px;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            object-fit: cover;
        }
        .delete-image-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #e11d48;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.8em;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            z-index: 10;
        }
        .add-photo-block {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            border-radius: 0.5rem;
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            cursor: pointer;
        }
        .add-more-button {
            background: none;
            border: none;
            color: #64748b;
            font-size: 2.5rem;
            cursor: pointer;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #signatureCanvas {
            border: 2px dashed #cbd5e1;
            border-radius: 0.5rem;
            background-color: #ffffff;
            cursor: crosshair;
            touch-action: none;
        }
        .pdf-page-canvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            max-width: 100%;
            height: auto !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
            border-radius: 0.375rem;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start py-6 px-3 font-sans text-slate-800">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-[998] hidden">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex items-center space-x-4">
            <svg class="animate-spin h-6 w-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p id="loadingText" class="text-slate-700 font-medium">Generando PDF...</p>
        </div>
    </div>

    <!-- MODAL DE PREVISUALIZACIÓN NÍTIDA (HD) -->
    <div id="previewModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[1000] hidden p-2 sm:p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full h-[94vh] flex flex-col overflow-hidden border border-slate-200">
            <div class="flex justify-between items-center bg-slate-900 text-white p-3.5 px-5">
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    <h3 class="font-bold text-xs sm:text-sm uppercase tracking-wider">Vista Previa (Desliza para ver todo)</h3>
                </div>
                <button type="button" id="closePreviewBtn" class="text-slate-400 hover:text-white text-2xl font-bold p-1 leading-none transition">&times;</button>
            </div>
            <div id="pdfContainer" class="flex-1 overflow-auto p-4 sm:p-8 bg-slate-200 flex flex-col items-center"></div>
            <div class="p-3.5 px-5 bg-slate-50 border-t flex justify-end items-center space-x-3">
                <button type="button" id="closePreviewBottomBtn" class="px-4 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 bg-white hover:bg-slate-100 transition">
                    Cerrar
                </button>
                <button type="button" id="downloadFromPreviewBtn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-blue-600/30 transition flex items-center space-x-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span>Descargar PDF Oficial</span>
                </button>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR PORTADA -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-5 sm:p-8 w-full max-w-md mb-6" id="portada">
        <div class="flex flex-col items-center mb-6">
            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 shadow-sm mb-3">
                <img src="https://www.freundferreteria.com/img/logo.svg" alt="Logo Freund" class="h-12 w-auto object-contain" />
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Reporte de Impresores</h1>
            <p class="text-xs text-slate-400 mt-0.5">Soporte Redes y Telecomunicaciones</p>
        </div>
        <form id="inicioForm" class="space-y-4">
            <div class="bg-slate-50/70 p-4 rounded-2xl border border-slate-100 space-y-3">
                <div>
                    <label for="tienda" class="block text-xs font-semibold text-slate-600 mb-1">TIENDA / ÁREA</label>
                    <input type="text" id="tienda" name="tienda" class="block w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2.5 border bg-white" required placeholder="Ej. Tienda Central" />
                </div>
                <div>
                    <label for="persona" class="block text-xs font-semibold text-slate-600 mb-1">RESPONSABLE</label>
                    <input type="text" id="persona" name="persona" class="block w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2.5 border bg-white" required placeholder="Ej. Juan Pérez" />
                </div>
            </div>
            <button type="submit" class="w-full flex justify-center items-center space-x-2 py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-blue-600/20 text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition active:scale-95">
                <span>Comenzar</span>
            </button>
        </form>
        <div class="text-center text-[10px] text-slate-400 mt-4 uppercase font-semibold">Powered by Jonathann</div>
    </div>

    <!-- CONTENEDOR APLICACIÓN PRINCIPAL -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-5 sm:p-8 w-full max-w-md mb-6" id="mainApp" style="display:none;">
        <div class="flex flex-col items-center mb-6">
            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 shadow-sm mb-3">
                <img src="https://raw.githubusercontent.com/invs99/FF/refs/heads/SEGUNDA/freund1.png" alt="Logo Freund" class="h-12 w-auto object-contain" />
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Secciones del Reporte</h1>
        </div>

        <div id="botonesSecciones" class="space-y-3"></div>

        <button id="addOtraAreaBtn" class="w-full mt-4 flex items-center justify-center space-x-2 py-3 px-4 rounded-xl text-sm font-semibold text-amber-900 bg-amber-100 hover:bg-amber-200 transition-colors shadow-sm" type="button">
            <span>OTRA ÁREA +</span>
        </button>

        <!-- Bloque de Firma Digital Integrado -->
        <div class="bg-slate-50/70 p-4 rounded-2xl border border-slate-100 mt-6">
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Firma del Responsable</label>
                <button type="button" id="clearSignatureButton" class="text-xs font-medium text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-lg transition-colors">
                    Borrar firma
                </button>
            </div>
            <div id="signatureCanvasContainer" class="relative w-full">
                <canvas id="signatureCanvas" class="w-full h-36"></canvas>
            </div>
        </div>

        <div class="space-y-2.5 pt-6 border-t mt-6">
            <button type="button" id="btnPreviewDoc" class="w-full flex justify-center items-center space-x-2 py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-emerald-600/20 text-xs sm:text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none transition active:scale-95 uppercase tracking-wide">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                <span>Previsualizar Documento</span>
            </button>

            <button type="button" id="generarPDF" class="w-full flex justify-center items-center space-x-2 py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-blue-600/20 text-xs sm:text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span>Generar Reporte PDF</span>
            </button>
            
            <button type="button" id="btnNuevoReporte" class="w-full flex justify-center items-center space-x-2 py-3 px-4 border border-transparent rounded-xl shadow-md text-xs font-bold text-white bg-red-600 hover:bg-red-700 focus:outline-none transition active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                <span>Nuevo Reporte / Limpiar</span>
            </button>
            
            <a href="index.html" class="w-full flex justify-center items-center space-x-2 py-3 px-4 border border-transparent rounded-xl shadow-md text-xs font-bold text-white bg-cyan-500 hover:bg-cyan-600 text-center transition active:scale-95 no-underline">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>Ir al Inicio</span>
            </a>
        </div>
        <div class="text-center text-[10px] text-slate-400 mt-4 uppercase font-semibold">Powered by Jonathann</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let currentPdfDoc = null;

        const { jsPDF } = window.jspdf;

        const portada = document.getElementById("portada");
        const mainApp = document.getElementById("mainApp");
        const inicioForm = document.getElementById("inicioForm");
        const botonesSecciones = document.getElementById("botonesSecciones");
        const btnNuevoReporte = document.getElementById("btnNuevoReporte");
        const generarPDFBtn = document.getElementById("generarPDF");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const addOtraAreaBtn = document.getElementById("addOtraAreaBtn");

        // Lógica de Firma Digital
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let hasSigned = false;

        function fillWhiteBackground() {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        function drawPlaceholder() {
            if (!hasSigned) {
                fillWhiteBackground();
                ctx.save();
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Firme aquí con su dedo o lápiz', canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('signatureCanvasContainer');
            if(container) {
                canvas.width = container.offsetWidth;
                canvas.height = 150;
                if (!hasSigned) drawPlaceholder();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas);

        function getPointerPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const source = e.touches ? e.touches[0] : e;
            return { x: source.clientX - rect.left, y: source.clientY - rect.top };
        }

        function startDrawing(e) {
            e.preventDefault();
            const point = getPointerPosition(e);
            isDrawing = true;
            lastX = point.x;
            lastY = point.y;
            if (!hasSigned) {
                fillWhiteBackground();
                hasSigned = true;
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const point = getPointerPosition(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(point.x, point.y);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.stroke();
            lastX = point.x;
            lastY = point.y;
        }

        function stopDrawing() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        document.getElementById('clearSignatureButton').addEventListener('click', () => {
            fillWhiteBackground();
            hasSigned = false;
            drawPlaceholder();
            localStorage.removeItem('signature_impresores');
        });

        const seccionesFijas = [
            "Recepción", "Sala de Recibo", "Eléctrico", "Herrajes", "Pintura", "Fontanería", "Herramientas"
        ];
        let todasLasSecciones = [];
        let nextDynamicAreaId = 0;

        const LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSroamFoZxhxDK8iAOsHT5NB7nFY9rlpPEr6w&s";
        let logoBase64 = null;
        let logoOriginalWidth = 0;
        let logoOriginalHeight = 0;

        const loadLogoAsBase64 = () => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    logoOriginalWidth = img.width;
                    logoOriginalHeight = img.height;
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    logoBase64 = canvas.toDataURL("image/png");
                    resolve();
                };
                img.onerror = (error) => {
                    logoBase64 = null;
                    logoOriginalWidth = 0;
                    logoOriginalHeight = 0;
                    reject(error);
                };
                img.src = LOGO_URL;
            });
        };

        const initializeSectionData = () => {
            seccionesFijas.forEach(nombre => {
                const key = "seccionData_" + nombre;
                if (!localStorage.getItem(key)) {
                    localStorage.setItem(key, JSON.stringify({ photos: [], comment: "" }));
                }
            });
            const savedDynamicAreas = JSON.parse(localStorage.getItem("dynamicAreas")) || [];
            if (savedDynamicAreas.length > 0) {
                nextDynamicAreaId = savedDynamicAreas.reduce((maxId, area) => Math.max(maxId, area.id + 1), 0);
            }
        };

        const compressImage = (file, maxWidth, maxHeight, quality) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height = height * (maxWidth / width); width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width = width * (maxHeight / height); height = maxHeight; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                    URL.revokeObjectURL(img.src);
                };
                img.onerror = error => reject(error);
            });
        };

        const createAndAppendSection = (nombre, isDynamic = false, dynamicId = null, activateImmediately = false) => {
            const btn = document.createElement("button");
            btn.className = "w-full flex items-center justify-between py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-700 bg-slate-50 hover:bg-slate-100 border border-slate-200 transition shadow-sm mb-2";
            btn.type = "button";
            btn.innerHTML = `<span>${nombre}</span><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>`;

            const contenedor = document.createElement("div");
            contenedor.className = "contenido-seccion bg-slate-50/70 p-4 rounded-2xl border border-slate-100 space-y-3 mb-3";
            contenedor.dataset.sectionName = nombre;

            let sectionKey = "seccionData_" + nombre;
            let customNameInput = null;

            if (isDynamic) {
                sectionKey = `seccionData_OTRA AREA_${dynamicId}`;
                customNameInput = document.createElement("input");
                customNameInput.type = "text";
                customNameInput.placeholder = "Nombre de la otra área";
                customNameInput.className = "block w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2.5 border bg-white mb-2";
                customNameInput.dataset.sectionId = dynamicId;

                const savedCustomName = localStorage.getItem(`customAreaName_OTRA AREA_${dynamicId}`);
                if (savedCustomName && savedCustomName.trim().length > 0) {
                    customNameInput.value = savedCustomName;
                    btn.querySelector('span').textContent = savedCustomName.toUpperCase();
                } else {
                    btn.querySelector('span').textContent = `OTRA AREA ${dynamicId}+`;
                }

                customNameInput.addEventListener("input", () => {
                    const newName = customNameInput.value.trim();
                    btn.querySelector('span').textContent = newName ? newName.toUpperCase() : `OTRA AREA ${dynamicId}+`;
                    localStorage.setItem(`customAreaName_OTRA AREA_${dynamicId}`, newName);
                });
                contenedor.appendChild(customNameInput);
            }

            const inputGaleria = document.createElement("input");
            inputGaleria.type = "file";
            inputGaleria.accept = "image/*";
            inputGaleria.multiple = true;
            inputGaleria.style.display = "none";

            const btnGaleria = document.createElement("button");
            btnGaleria.textContent = "📷 Agregar Foto / Cámara";
            btnGaleria.className = "w-full py-2.5 px-3 rounded-xl text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 transition border border-blue-200 shadow-sm";
            btnGaleria.type = "button";
            contenedor.appendChild(btnGaleria);
            contenedor.appendChild(inputGaleria);

            const previewDiv = document.createElement("div");
            previewDiv.className = "preview-images flex flex-wrap gap-2 justify-center mt-2";
            contenedor.appendChild(previewDiv);

            const comentario = document.createElement("textarea");
            comentario.placeholder = "Comentario para esta sección (opcional)";
            comentario.className = "block w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2.5 border bg-white mt-2";
            contenedor.appendChild(comentario);

            const loadSectionData = () => {
                previewDiv.innerHTML = "";
                const data = JSON.parse(localStorage.getItem(sectionKey));
                if (data && data.photos) {
                    data.photos.forEach((src) => {
                        const imgContainer = document.createElement("div");
                        imgContainer.className = "image-container relative inline-block";
                        const img = document.createElement("img");
                        img.src = src;
                        imgContainer.appendChild(img);

                        const deleteBtn = document.createElement("button");
                        deleteBtn.textContent = "×";
                        deleteBtn.className = "delete-image-btn";
                        deleteBtn.addEventListener("click", () => {
                            let currentData = JSON.parse(localStorage.getItem(sectionKey));
                            currentData.photos = currentData.photos.filter(photoSrc => photoSrc !== src);
                            localStorage.setItem(sectionKey, JSON.stringify(currentData));
                            loadSectionData();
                        });
                        imgContainer.appendChild(deleteBtn);
                        previewDiv.appendChild(imgContainer);
                    });
                }
                comentario.value = (data && data.comment) ? data.comment : "";
            };
            loadSectionData();

            btn.addEventListener("click", () => {
                document.querySelectorAll(".contenido-seccion").forEach(c => {
                    if (c !== contenedor) c.style.display = "none";
                });
                contenedor.style.display = contenedor.style.display === "block" ? "none" : "block";
                if (contenedor.style.display === "block") contenedor.scrollIntoView({ behavior: "smooth" });
            });

            btnGaleria.addEventListener("click", () => inputGaleria.click());

            inputGaleria.addEventListener("change", async e => {
                if (e.target.files.length > 0) {
                    let currentData = JSON.parse(localStorage.getItem(sectionKey)) || { photos: [], comment: "" };
                    for (let file of e.target.files) {
                        try {
                            const compressed = await compressImage(file, 800, 800, 0.7);
                            currentData.photos.push(compressed);
                        } catch (err) { console.error(err); }
                    }
                    localStorage.setItem(sectionKey, JSON.stringify(currentData));
                    loadSectionData();
                    inputGaleria.value = "";
                }
            });

            comentario.addEventListener("input", () => {
                let currentData = JSON.parse(localStorage.getItem(sectionKey)) || { photos: [], comment: "" };
                currentData.comment = comentario.value;
                localStorage.setItem(sectionKey, JSON.stringify(currentData));
            });

            botonesSecciones.appendChild(btn);
            botonesSecciones.appendChild(contenedor);
            todasLasSecciones.push({ name: nombre, isDynamic: isDynamic, dynamicId: dynamicId });

            if (activateImmediately) {
                document.querySelectorAll(".contenido-seccion").forEach(c => c.style.display = "none");
                contenedor.style.display = "block";
                contenedor.scrollIntoView({ behavior: "smooth" });
            }
            return { btn: btn, contenedor: contenedor };
        };

        const addDynamicAreaSection = () => {
            const dynamicAreaName = `OTRA AREA_${nextDynamicAreaId}`;
            localStorage.setItem("seccionData_" + dynamicAreaName, JSON.stringify({ photos: [], comment: "" }));

            let savedDynamicAreas = JSON.parse(localStorage.getItem("dynamicAreas")) || [];
            savedDynamicAreas.push({ id: nextDynamicAreaId, name: dynamicAreaName });
            localStorage.setItem("dynamicAreas", JSON.stringify(savedDynamicAreas));

            const { contenedor } = createAndAppendSection(dynamicAreaName, true, nextDynamicAreaId, true);
            nextDynamicAreaId++;
            const customInput = contenedor.querySelector('input');
            if (customInput) customInput.focus();
        };

        inicioForm.addEventListener("submit", async e => {
            e.preventDefault();
            const tienda = document.getElementById("tienda").value.trim();
            const persona = document.getElementById("persona").value.trim();
            if (!tienda || !persona) {
                alert("Por favor completa todos los campos.");
                return;
            }
            localStorage.setItem("tienda", tienda);
            localStorage.setItem("persona", persona);

            initializeSectionData();

            portada.style.display = "none";
            mainApp.style.display = "block";

            botonesSecciones.innerHTML = "";
            todasLasSecciones = [];

            seccionesFijas.forEach(nombre => createAndAppendSection(nombre));
            (JSON.parse(localStorage.getItem("dynamicAreas")) || []).forEach(area => {
                createAndAppendSection(area.name, true, area.id);
            });
            resizeCanvas();
        });

        addOtraAreaBtn.addEventListener("click", addDynamicAreaSection);

        btnNuevoReporte.addEventListener("click", () => {
            if (confirm("¿Estás seguro de que quieres iniciar un nuevo reporte? Todos los datos actuales se borrarán.")) {
                seccionesFijas.forEach(nombre => localStorage.removeItem("seccionData_" + nombre));
                (JSON.parse(localStorage.getItem("dynamicAreas")) || []).forEach(area => {
                    localStorage.removeItem(`seccionData_OTRA AREA_${area.id}`);
                    localStorage.removeItem(`customAreaName_OTRA AREA_${area.id}`);
                });
                localStorage.removeItem("dynamicAreas");
                localStorage.removeItem("tienda");
                localStorage.removeItem("persona");
                localStorage.removeItem("signature_impresores");

                document.getElementById("tienda").value = "";
                document.getElementById("persona").value = "";
                fillWhiteBackground();
                hasSigned = false;
                drawPlaceholder();

                mainApp.style.display = "none";
                portada.style.display = "block";
                botonesSecciones.innerHTML = "";
                todasLasSecciones = [];
                nextDynamicAreaId = 0;
            }
        });

        const addHeaderAndFooter = (doc, pageNumber) => {
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 15;
            const headerBottomLineY = 30;

            let finalLogoHeight = 0;
            const logoStart_Y = 10;

            if (logoBase64 && logoOriginalWidth > 0 && logoOriginalHeight > 0) {
                const pdfLogoWidth = 30;
                const calculatedLogoHeight = (pdfLogoWidth / logoOriginalWidth) * logoOriginalHeight;
                finalLogoHeight = Math.min(calculatedLogoHeight, 15);
                doc.addImage(logoBase64, 'PNG', margin, logoStart_Y, pdfLogoWidth, finalLogoHeight);
            }

            doc.setFontSize(18);
            doc.setTextColor("#2c3e50");
            const titleY = logoStart_Y + (finalLogoHeight / 2) + 3;
            doc.setFont("helvetica", "bold");
            doc.text("REPORTE DE IMPRESORES", pageWidth / 2, titleY, { align: "center" });
            doc.setFont("helvetica", "normal");

            doc.setDrawColor(150);
            doc.setLineWidth(0.3);
            doc.line(margin, headerBottomLineY, pageWidth - margin, headerBottomLineY);

            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text(`Página ${pageNumber}`, pageWidth - margin, pageHeight - 10, { align: "right" });
            doc.setTextColor(0);
            doc.setDrawColor(0);
        };

        // FUNCIÓN ORIGINAL INTACTA PARA CONSTRUIR EL PDF + INCLUSIÓN DE FIRMA Y RESPONSABLE
        async function buildPdfDoc() {
            const tienda = localStorage.getItem("tienda") || "Sin Nombre Tienda";
            const persona = localStorage.getItem("persona") || "Sin Nombre Responsable";
            const currentDate = new Date().toLocaleDateString('es-ES', {
                year: 'numeric', month: 'long', day: 'numeric'
            });

            try {
                await loadLogoAsBase64();
            } catch (error) {
                logoBase64 = null;
                logoOriginalWidth = 0;
                logoOriginalHeight = 0;
            }

            const doc = new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4",
            });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 15;
            const contentStartY = 35;

            addHeaderAndFooter(doc, 1);

            doc.setFontSize(14);
            let currentY = contentStartY + 5;

            doc.text(`Tienda / Area: ${tienda}`, margin, currentY);
            currentY += 10;
            doc.text(`Responsable: ${persona}`, margin, currentY);
            currentY += 10;
            doc.text(`Fecha del Reporte: ${currentDate}`, margin, currentY);
            currentY += 20;

            let pageCounter = 1;
            let firstContentSectionDrawn = false;

            for (const sectionInfo of todasLasSecciones) {
                let sectionData;
                let sectionNameForPdf;
                let sectionKey;

                if (sectionInfo.isDynamic) {
                    sectionKey = `seccionData_OTRA AREA_${sectionInfo.dynamicId}`;
                    sectionData = JSON.parse(localStorage.getItem(sectionKey));
                    const customName = localStorage.getItem(`customAreaName_OTRA AREA_${sectionInfo.dynamicId}`);
                    sectionNameForPdf = (customName && customName.trim().length > 0) ? customName.toUpperCase() : `OTRA AREA ${sectionInfo.dynamicId}`.toUpperCase();
                } else {
                    sectionKey = `seccionData_${sectionInfo.name}`;
                    sectionData = JSON.parse(localStorage.getItem(sectionKey));
                    sectionNameForPdf = sectionInfo.name.toUpperCase();
                }

                if (!sectionData || (sectionData.photos.length === 0 && sectionData.comment.trim().length === 0)) {
                    continue;
                }

                let commentBoxHeight = 0;
                let commentTextLines = [];
                if (sectionData.comment && sectionData.comment.trim().length > 0) {
                    doc.setFontSize(12);
                    const commentText = "Comentario: " + sectionData.comment;
                    const commentBoxWidth = pageWidth - margin * 2;
                    const padding = 5;
                    commentTextLines = doc.splitTextToSize(commentText, commentBoxWidth - padding * 2);
                    const textHeight = commentTextLines.length * 7;
                    commentBoxHeight = textHeight + padding * 2;
                }

                const imagesPerRow = 2;
                const imgGap = 10;
                let requiredImagesHeight = 0;
                if (sectionData.photos.length > 0) {
                    const numRows = Math.ceil(sectionData.photos.length / imagesPerRow);
                    const estimatedImgHeight = 60;
                    requiredImagesHeight = (numRows * estimatedImgHeight) + ((numRows - 1) * imgGap);
                }

                if (firstContentSectionDrawn && (currentY + 20 + requiredImagesHeight + commentBoxHeight + 15 + margin > pageHeight)) {
                    doc.addPage();
                    pageCounter++;
                    addHeaderAndFooter(doc, pageCounter);
                    currentY = contentStartY;
                } else if (!firstContentSectionDrawn) {
                    firstContentSectionDrawn = true;
                }

                doc.setFontSize(18);
                doc.setTextColor("#2c3e50");
                doc.text(sectionNameForPdf, pageWidth / 2, currentY + 5, { align: "center" });
                currentY += 20;

                let calculatedImgWidth = 0;
                let calculatedImgHeight = 0;
                if (sectionData.photos.length > 0) {
                    const availableSpaceForImages = pageHeight - currentY - margin - commentBoxHeight - (commentBoxHeight > 0 ? 15 : 0) - 5;
                    const numRows = Math.ceil(sectionData.photos.length / imagesPerRow);
                    const totalVerticalGap = (numRows - 1) * imgGap;
                    calculatedImgHeight = (availableSpaceForImages - totalVerticalGap) / numRows;
                    const maxPossibleWidthForTwoImages = (pageWidth - (margin * 2) - imgGap) / imagesPerRow;
                    calculatedImgWidth = Math.min(calculatedImgHeight, maxPossibleWidthForTwoImages);
                    calculatedImgHeight = calculatedImgWidth;
                    if (calculatedImgWidth < 20) {
                        calculatedImgWidth = 20;
                        calculatedImgHeight = 20;
                    }
                }

                let imagesInCurrentRow = 0;
                let currentRowStartX = 0;
                let currentRowMaxHeight = 0;

                for (let i = 0; i < sectionData.photos.length; i++) {
                    const imgData = sectionData.photos[i];
                    if (imagesInCurrentRow === 0 || imagesInCurrentRow >= imagesPerRow) {
                        if (imagesInCurrentRow >= imagesPerRow) {
                            currentY += currentRowMaxHeight + imgGap;
                        }
                        imagesInCurrentRow = 0;
                        currentRowMaxHeight = 0;

                        const numImagesForThisRow = Math.min(imagesPerRow, sectionData.photos.length - i);
                        const totalRowWidth = (numImagesForThisRow * calculatedImgWidth) + ((numImagesForThisRow - 1) * imgGap);
                        currentRowStartX = (pageWidth - totalRowWidth) / 2;
                    }

                    const imgX = currentRowStartX + (imagesInCurrentRow * (calculatedImgWidth + imgGap));
                    try {
                        const imgType = imgData.substring("data:image/".length, imgData.indexOf(";base64")).toUpperCase();
                        doc.addImage(imgData, imgType, imgX, currentY, calculatedImgWidth, calculatedImgHeight);
                    } catch (error) {}

                    imagesInCurrentRow++;
                    currentRowMaxHeight = Math.max(currentRowMaxHeight, calculatedImgHeight);
                }

                if (sectionData.photos.length > 0) {
                    currentY += currentRowMaxHeight + 15;
                }

                if (sectionData.comment && sectionData.comment.trim().length > 0) {
                    doc.setFontSize(12);
                    const commentBoxWidth = pageWidth - margin * 2;
                    const padding = 5;
                    doc.rect(margin, currentY, commentBoxWidth, commentBoxHeight, 'S');
                    doc.text(commentTextLines, margin + padding, currentY + padding + 5, { align: "left" });
                    currentY += commentBoxHeight + 15;
                }
            }

            // Integración final de la Firma Digital y Nombre del Responsable
            if (hasSigned) {
                if (currentY + 45 > pageHeight - 15) {
                    doc.addPage();
                    pageCounter++;
                    addHeaderAndFooter(doc, pageCounter);
                    currentY = contentStartY;
                } else {
                    currentY += 10;
                }

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);

                const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const dataPixels = imgData.data;
                for (let i = 0; i < dataPixels.length; i += 4) {
                    if (dataPixels[i] > 240 && dataPixels[i + 1] > 240 && dataPixels[i + 2] > 240) {
                        dataPixels[i + 3] = 0;
                    }
                }
                tempCtx.putImageData(imgData, 0, 0);
                const signatureDataUrl = tempCanvas.toDataURL('image/png');

                const sigWidth = 50;
                const sigHeight = (canvas.height / canvas.width) * sigWidth;
                doc.addImage(signatureDataUrl, 'PNG', margin, currentY, sigWidth, Math.min(sigHeight, 20));
                currentY += 22;

                doc.setDrawColor(0);
                doc.setLineWidth(0.3);
                doc.line(margin, currentY, margin + 60, currentY);
                currentY += 5;

                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.text(persona, margin, currentY);
                currentY += 5;
                doc.text("Responsable", margin, currentY);
            }

            return doc;
        }

        function guardarPdf(doc) {
            const tienda = localStorage.getItem("tienda") || "Sin Nombre Tienda";
            doc.save(`Reporte_${tienda.replace(/\s/g, "_")}_${new Date().toISOString().slice(0, 10)}.pdf`);
        }

        generarPDFBtn.addEventListener("click", async () => {
            document.getElementById('loadingText').textContent = 'Generando PDF...';
            loadingOverlay.style.display = 'flex';
            try {
                const doc = await buildPdfDoc();
                guardarPdf(doc);
                loadingOverlay.style.display = 'none';
            } catch (error) {
                loadingOverlay.style.display = 'none';
                alert('Ocurrió un error al generar el PDF.');
            }
        });

        async function renderVerticalPreview(pdfDocObj) {
            const container = document.getElementById('pdfContainer');
            container.innerHTML = ''; 
            for (let i = 1; i <= pdfDocObj.numPages; i++) {
                const page = await pdfDocObj.getPage(i);
                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-page-canvas bg-white';
                container.appendChild(canvas);
                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 2.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            }
        }

        document.getElementById('btnPreviewDoc').addEventListener('click', async () => {
            document.getElementById('loadingText').textContent = 'Cargando vista previa...';
            loadingOverlay.style.display = 'flex';
            try {
                currentPdfDoc = await buildPdfDoc();
                const pdfArrayBuffer = currentPdfDoc.output('arraybuffer');
                const pdfPdfDocObj = await pdfjsLib.getDocument({ data: pdfArrayBuffer }).promise;
                await renderVerticalPreview(pdfPdfDocObj);
                loadingOverlay.style.display = 'none';
                document.getElementById('previewModal').classList.remove('hidden');
            } catch (err) {
                loadingOverlay.style.display = 'none';
                alert('Ocurrió un error al previsualizar el PDF.');
            }
        });

        const cerrarModalPreview = () => document.getElementById('previewModal').classList.add('hidden');
        document.getElementById('closePreviewBtn').addEventListener('click', cerrarModalPreview);
        document.getElementById('closePreviewBottomBtn').addEventListener('click', cerrarModalPreview);
        document.getElementById('downloadFromPreviewBtn').addEventListener('click', () => {
            if (currentPdfDoc) guardarPdf(currentPdfDoc);
        });
    </script>
</body>
